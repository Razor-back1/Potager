name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # Playwright 1.56 ne sait pas encore installer ses dépendances sur Ubuntu 26 (ubuntu-latest depuis le 19 octobre 2026)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Les fichiers publiés correspondent aux sources (src/)
        run: python3 tools/build.py && git diff --exit-code -- . ':!*.png'
      - name: Installer Playwright et Chromium
        working-directory: tests
        run: npm install && npx playwright install --with-deps chromium
      - name: Tests de l'app (iPhone simulé) et du relais (base D1 simulée)
        working-directory: tests
        run: npm test
