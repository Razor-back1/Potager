<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier Potager</title>
<meta name="description" content="Plan, plantations, récoltes et journal du potager.">
<meta name="theme-color" content="#fafbf6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1e20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Potager">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: one-screen app — header, full-bleed plan canvas with a bottom sheet, bottom tab bar. Plan reads like a surveyor's sheet on sage paper. */
:root{
  --bg:#e9ede1; --surface:#fafbf6; --surface-2:#f1f3ea; --ink:#1d271b; --muted:#5d6955; --line:#cdd4c1;
  --accent:#2c6a39; --accent-ink:#ffffff; --sun:#d9951c; --grid:rgba(44,106,57,.10); --grid-strong:rgba(44,106,57,.22);
  --ground:#dfe6cf; --soil:#8b6a48; --soil-edge:#5e4529; --water:#3a82b5; --leaf:#5c9a45; --leaf-dark:#2f5d2b;
  --gravel:#cdc6b5; --wood:#a3713f; --danger:#b8392b; --ok:#2e8547; --halo:#fafbf6; --shade:rgba(22,32,60,.30); --frost:#3a6fb5;
  --sky1:#fdf4dc; --sky2:#e3efe0; --skyr1:#e3ebf3; --skyr2:#eef1ea; --skyc1:#edefec; --skyc2:#e6e9e2; --skyn1:#2a3350; --skyn2:#3c4766; --glass:rgba(255,255,255,.6);
  --sunc:#f2a91d; --moonc:#f3e7b8; --cloudc:#ffffff; --cloudl:#c9d1d6; --cloudb:#e6eaee; --cloudd:#aab4bf; --snowc:#ffffff; --boltc:#f5c330;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141516; --surface:#1d1e20; --surface-2:#26282a; --ink:#ebe8e2; --muted:#a19e96; --line:#34363a;
  --accent:#7cbf6a; --accent-ink:#10150f; --sun:#f0b445; --grid:rgba(255,255,255,.045); --grid-strong:rgba(255,255,255,.10);
  --ground:#1f2221; --soil:#6b5038; --soil-edge:#3f2c1a; --water:#4f9bd0; --leaf:#4c8a3a; --leaf-dark:#2c5226;
  --gravel:#46443f; --wood:#8a6038; --danger:#ee6a58; --ok:#6fca7a; --halo:#1d1e20; --shade:rgba(0,0,0,.45); --frost:#7fb0ee; --sky1:#2a2a22; --sky2:#1f2621; --skyr1:#1e2530; --skyr2:#1d2023; --skyc1:#232527; --skyc2:#1d1f21; --skyn1:#151a2b; --skyn2:#20263a; --glass:rgba(255,255,255,.08);
  --sunc:#f5b638; --moonc:#efe2ad; --cloudc:#cfd5db; --cloudl:#8d969e; --cloudb:#9aa3ab; --cloudd:#7c8792; --snowc:#f2f5f7; --boltc:#f7cf4a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141516; --surface:#1d1e20; --surface-2:#26282a; --ink:#ebe8e2; --muted:#a19e96; --line:#34363a;
  --accent:#7cbf6a; --accent-ink:#10150f; --sun:#f0b445; --grid:rgba(255,255,255,.045); --grid-strong:rgba(255,255,255,.10);
  --ground:#1f2221; --soil:#6b5038; --soil-edge:#3f2c1a; --water:#4f9bd0; --leaf:#4c8a3a; --leaf-dark:#2c5226;
  --gravel:#46443f; --wood:#8a6038; --danger:#ee6a58; --ok:#6fca7a; --halo:#1d1e20; --shade:rgba(0,0,0,.45); --frost:#7fb0ee; --sky1:#2a2a22; --sky2:#1f2621; --skyr1:#1e2530; --skyr2:#1d2023; --skyc1:#232527; --skyc2:#1d1f21; --skyn1:#151a2b; --skyn2:#20263a; --glass:rgba(255,255,255,.08);
  --sunc:#f5b638; --moonc:#efe2ad; --cloudc:#cfd5db; --cloudl:#8d969e; --cloudb:#9aa3ab; --cloudd:#7c8792; --snowc:#f2f5f7; --boltc:#f7cf4a; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);max-width:1100px;margin:0 auto;position:relative}

.top{display:flex;align-items:center;gap:8px;padding-block:10px;padding-inline:16px;border-bottom:1px solid var(--line);background:var(--surface)}
.top>div:first-child{min-width:0;flex:1 1 auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:99px;background:var(--sun);color:#1d1404;font-weight:700}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn:disabled{opacity:.35}
.iconbtn.on{background:var(--sun);border-color:var(--sun);color:#1d1404}

main{position:relative;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto}

#map{width:100%;height:100%;display:block;touch-action:none;background:var(--bg);user-select:none;-webkit-user-select:none}
.ground{fill:var(--ground)} .bound{fill:none;stroke:var(--accent);stroke-width:1.5}
.dimtxt{fill:var(--muted);font-family:var(--f-mono)}
.obj{cursor:grab}
.obj text{font-family:var(--f-body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.s-soil{fill:var(--soil);stroke:var(--soil-edge)} .s-wood{fill:var(--soil);stroke:var(--wood)}
.s-water{fill:var(--water);fill-opacity:.85;stroke:var(--water)} .s-water-l{fill:var(--water);fill-opacity:.25;stroke:var(--water)}
.s-leaf{fill:var(--leaf);fill-opacity:.35;stroke:var(--leaf-dark)} .s-leaf-solid{fill:var(--leaf-dark);stroke:var(--leaf-dark)}
.s-trunk{fill:var(--wood)} .s-gravel{fill:var(--gravel);stroke:var(--line)} .s-serre{fill:var(--water);fill-opacity:.10;stroke:var(--water);stroke-dasharray:6 4}
.s-wood-solid{fill:var(--wood);stroke:var(--soil-edge)} .s-fence{fill:var(--wood);stroke:none} .s-plug{fill:var(--sun);stroke:var(--ink)}
.s-roof{stroke:var(--soil-edge);fill:none} .s-zone-line{stroke:var(--halo);stroke-opacity:.7}
.selbox{fill:none;stroke:var(--sun);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.selbox.locked{stroke:var(--muted);stroke-dasharray:2 3}
.handle{fill:var(--sun);stroke:var(--surface);stroke-width:2;cursor:nwse-resize}
.badge circle{stroke:var(--surface);stroke-width:1.5} .badge text{fill:#fff;font-family:var(--f-mono);font-weight:600;stroke:none}
.badge.red circle{fill:var(--danger)} .badge.amber circle{fill:var(--sun)} .badge.amber text{fill:#1d1404}
.obj.lift{filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.obj.lift .selbox{stroke-dasharray:none;stroke-width:3}
.shadepoly{fill:var(--shade);pointer-events:none}
.rotring{fill:none;stroke:var(--sun);stroke-width:2;stroke-dasharray:5 5;pointer-events:none}
.rothit{fill:none;stroke:transparent;stroke-width:30px;pointer-events:stroke;cursor:grab}
.rotline{stroke:var(--sun);stroke-width:1.5;opacity:.6;pointer-events:none}
.rotknob{fill:var(--sun);stroke:var(--surface);stroke-width:2;cursor:grab}
.rotknobt{fill:#1d1404;font-family:var(--f-mono);font-weight:600;pointer-events:none}
.edgehit{stroke:transparent;stroke-width:24px;pointer-events:stroke;cursor:move;fill:none}
.vtx{fill:var(--surface);stroke:var(--accent);stroke-width:2.5;cursor:move} .vtx.sel{fill:var(--sun);stroke:var(--ink)} .mid{fill:var(--accent);fill-opacity:.55;cursor:copy}
.edgetxt{fill:var(--accent);font-family:var(--f-mono);font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.guide{stroke:var(--sun);stroke-width:1.5;stroke-dasharray:4 3;pointer-events:none}
#shadeL,#overL{pointer-events:none}
#map.editing{box-shadow:inset 0 0 0 3px var(--sun)}
.modetag{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;background:var(--sun);color:#1d1404;padding:3px 10px;border-radius:99px;pointer-events:none}
.cs-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.cs-head .nm{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.15;text-wrap:balance}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick .btn{min-height:46px;padding:0 8px;font-size:13.5px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px 0;justify-self:start}
.info{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2)}
.ilist{display:grid;gap:8px}
.irow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.irow>i{width:12px;height:12px;border-radius:50%;display:block}
.irow>i.drop{background:var(--water);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.irow b{display:block}
.st{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.st.ready{color:var(--ok);font-weight:600}.st.blocked{color:var(--danger);font-size:12px}
.badge.shade circle{fill:var(--muted)} .badge.green circle{fill:var(--ok)} .badge.blue circle{fill:var(--water)}
.helpgrid{display:grid;gap:10px}
.hrow{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.hrow .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-family:var(--f-mono)}
.hrow .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.dot-b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-family:var(--f-mono);font-weight:600}
.abhome{display:grid;gap:12px}
.wxhero{display:grid;gap:12px;padding:16px;border-radius:20px;border:1px solid var(--line);text-align:left;width:100%;color:var(--ink);background:linear-gradient(160deg,var(--sky1),var(--sky2));position:relative;overflow:hidden}
.wxhero.rain,.wxhero.showers,.wxhero.drizzle,.wxhero.storm{--sky1:var(--skyr1);--sky2:var(--skyr2)}
.wxhero.cloudy,.wxhero.fog{--sky1:var(--skyc1);--sky2:var(--skyc2)}
.wxhero.night{--sky1:var(--skyn1);--sky2:var(--skyn2)}
.wxhero.night{color:#eef1f8;--glass:rgba(255,255,255,.14)}
.wxhero.night .note,.wxhero.night .wxdeg small{color:rgba(238,241,248,.7)}
.wxhero.night .wxdays .note{color:rgba(238,241,248,.6)}
.wxmain{display:flex;align-items:center;gap:14px}
.wxhero .wxi{width:84px;height:84px;flex:none}
.wxt{display:grid;gap:2px}
.wxdeg{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wxdeg small{font-size:18px;font-weight:500;color:var(--muted);margin-left:2px}
.wxlbl{font-weight:700;font-size:15px}
.wxbits{display:flex;flex-wrap:wrap;gap:6px}
.wxbits span{font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--glass);font-family:var(--f-mono)}
.wxbits .wfrost{background:var(--frost);color:#fff;font-weight:600}
.wxdays{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-top:10px;border-top:1px solid var(--glass)}
.wxd{display:grid;justify-items:center;gap:1px;font-size:12px}
.wxd .wxi{width:34px;height:34px}
.wxd b{font-family:var(--f-mono);font-size:13px}
.wxi .wsun circle{fill:var(--sunc)} .wxi .wsun line{stroke:var(--sunc);stroke-width:3.2;stroke-linecap:round}
.wxi .wmoon path{fill:var(--moonc)} .wxi .wstars circle{fill:var(--moonc)}
.wxi .wcloud path{fill:var(--cloudc);stroke:var(--cloudl);stroke-width:1.5} .wxi .wcloud.wback path{fill:var(--cloudb)} .wxi .wcloud.wdark path{fill:var(--cloudd)}
.wxi .wrain line{stroke:var(--water);stroke-width:3;stroke-linecap:round} .wxi .wrain.small line{stroke-width:2.2}
.wxi .wsnow circle{fill:var(--snowc);stroke:var(--cloudl);stroke-width:.8}
.wxi .wfog line{stroke:var(--muted);stroke-width:3.5;stroke-linecap:round}
.wxi .wbolt{fill:var(--boltc)}
@media (prefers-reduced-motion:no-preference){
 .wxi .wsun.wxa .wrays{animation:wspin 18s linear infinite}
 .wxi .wcloud.wxa{animation:wdrift 6s ease-in-out infinite alternate}
 .wxi .wcloud.wback.wxa{animation-duration:9s;animation-direction:alternate-reverse}
 .wxi .wrain.wxa line{animation:wdrop 1s linear infinite}
 .wxi .wsnow.wxa circle{animation:wflake 2.4s linear infinite}
 .wxi .wfog.wxa line{animation:wfogm 4s ease-in-out infinite alternate}
 .wxi .wbolt.wxa{animation:wflash 3.2s steps(1) infinite}
 .wxi .wstars.wxa circle{animation:wtw 2.8s ease-in-out infinite alternate} .wxi .wstars.wxa circle:nth-child(2){animation-delay:1s}
}
@keyframes wspin{to{transform:rotate(360deg)}}
@keyframes wdrift{from{translate:-2px 0}to{translate:3px 0}}
@keyframes wdrop{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(10px);opacity:0}}
@keyframes wflake{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translate(3px,12px);opacity:0}}
@keyframes wfogm{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
@keyframes wflash{0%,86%,100%{opacity:1}88%,92%{opacity:.15}}
@keyframes wtw{from{opacity:.3}to{opacity:1}}
.tsec{display:grid;gap:10px;scroll-margin-top:8px}
.tsec-h{display:flex;align-items:center;gap:10px;padding-top:6px;border-top:2px solid var(--line)}
.tsec-h svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;flex:none}
.tsec-h h2{font-size:19px!important}
.tsec-h .n{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border-radius:99px;padding:1px 8px}
.tcard{display:grid;gap:10px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.tcard h3{display:flex;align-items:center;gap:8px}
.tcard h3 .n{font-family:var(--f-mono);font-size:13px;font-weight:600;background:var(--surface-2);border-radius:99px;padding:1px 8px}
.tcard.frost{border-color:var(--frost)} .tcard.urgent{border-color:var(--sun)}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.trow:first-of-type{border-top:0}
.trow>i{width:12px;height:12px;border-radius:50%;display:block}
.pest{display:grid;gap:2px;padding:8px 0;border-top:1px dashed var(--line)}
.sugg{display:grid;gap:8px}
.sg{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sg>i{width:12px;height:12px;border-radius:50%;display:block}
.sg .rs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rs span{font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.rs .ok{border-color:var(--ok);color:var(--ok)} .rs .warn{border-color:var(--sun)} .rs .bad{border-color:var(--danger);color:var(--danger)}
.tl{display:grid;gap:10px}
.tlhead,.tlrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center}
.mths{display:grid;grid-template-columns:repeat(12,1fr);font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center}
.track{position:relative;height:24px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.track .b{position:absolute;top:3px;bottom:3px;border-radius:5px;font-size:11px;font-weight:700;color:#fff;padding:0 6px;white-space:nowrap;overflow:hidden;line-height:18px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.track .b.pl{background:transparent!important;border:2px dashed;color:var(--ink);text-shadow:none;line-height:14px}
.track .now{position:absolute;top:0;bottom:0;width:2px;background:var(--sun)}
.tlrow .zl{font-size:12.5px;font-weight:700;line-height:1.2}
.nexts{grid-column:1/-1;display:grid;gap:6px}
.plrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 8px;border:1px dashed var(--line);border-radius:10px}
.plrow>i{width:10px;height:10px;border-radius:50%;display:block}
.plrow.cur{border-style:solid}
.abcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.abcard svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.7}
.abcard b{display:block;font-family:var(--f-display);font-size:20px}
.chev{color:var(--muted);font-size:22px}
.prod{display:grid;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.prod:last-child{border-bottom:0}
.prod .top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;cursor:pointer;border:0;background:none;padding:0;text-align:left;width:100%}
.prod .q{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.prod .q small{font-size:12px;color:var(--muted);font-weight:400}
.low{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:#1d1404;background:var(--sun);padding:1px 7px;border-radius:99px;margin-left:6px}
.out{background:var(--danger);color:#fff}
.mv{display:grid;grid-template-columns:auto 1fr auto;gap:10px;font-size:13px;padding:4px 0;border-top:1px dashed var(--line)}
.mv .d{font-family:var(--f-mono);color:var(--muted)} .mv .v{font-family:var(--f-mono)}
.bednav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.bednav button{flex:none;min-height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700}
.kv{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.kv .k{color:var(--muted)}

.fab{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45}
.btn.danger{color:var(--danger)} .btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.on{background:var(--sun);border-color:var(--sun);color:#1d1404}
.btn.small{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

h3{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;text-wrap:balance}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.stack{display:grid;gap:12px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

.jent .k.traitement{color:var(--danger)} .jent .k.recolte{color:var(--ok)} .jent .k.arrosage{color:var(--water)} .jent .k.amendement{color:var(--wood)} .jent .k.maladie{color:var(--sun)} .jent .k.semis{color:var(--accent)}

.stat{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:grid;gap:2px}

.stat .v small{font-size:14px;color:var(--muted);font-weight:500}
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.hbar .track{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.hbar .track span{display:block;height:100%;border-radius:6px}
.hbar .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.cmp{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface)}

.up{color:var(--ok)} .down{color:var(--danger)}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:2px 12px max(env(safe-area-inset-bottom,0px),16px)}
.tabs button{display:grid;justify-items:center;gap:3px;padding:8px 2px 6px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (min-width:760px){ .sheet{left:auto;right:16px;bottom:16px;width:380px;border-radius:18px;border:1px solid var(--line);max-height:calc(100% - 32px)} .sunbar{right:auto;width:420px}}

/* ================= Géométrie des planches ================= */
function zoneGrid(o,z){
  const p=P[z.crop];if(!p)return null;
  const W=Math.min(o.w,o.h);
  const cols=Math.max(1,Math.floor(z.len/Math.max(p.pl,15))),rows=Math.max(1,Math.floor(W/Math.max(p.rang,15)));
  const cellL=z.len/cols,cellW=W/rows;
  return{cols,rows,cellL,cellW,per:Math.max(1,Math.round(cellL/p.pl))*Math.max(1,Math.round(cellW/p.rang))};
}
function fillZone(o,z,date,frac=1){const g=zoneGrid(o,z);if(!g)return;for(let r=0;r<g.rows;r++)for(let c=0;c<Math.ceil(g.cols*frac);c++)if(!z.cells[r+'-'+c])z.cells[r+'-'+c]=date}
function trimCells(o,z){const g=zoneGrid(o,z);if(!g){z.cells={};return}for(const k in z.cells){const[r,c]=k.split('-').map(Number);if(r>=g.rows||c>=g.cols)delete z.cells[k]}}
const zoneArea=(o,z)=>z.len*Math.min(o.w,o.h)/1e4;
/* contenance d'une cuve cylindrique : π r² h, en litres */
const cuveL=o=>Math.PI*(o.w/2)**2*(+o.height||0)/1000;
function tankCap(){const cs=allObjs().filter(o=>o.type==='cuve'&&+o.height>0);return cs.length?{n:cs.length,cap:Math.round(cs.reduce((s,o)=>s+cuveL(o),0))}:null}

/* ================= Compagnonnage & rotation ================= */
function aabb(o){const a=o.rot*Math.PI/180,c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a));const bw=o.w*c+o.h*s,bh=o.w*s+o.h*c,cx=o.x+o.w/2,cy=o.y+o.h/2;return{x0:cx-bw/2,y0:cy-bh/2,x1:cx+bw/2,y1:cy+bh/2}}

const neighbors=o=>homeOf(o).objs.filter(p=>p!==o&&TYPES[p.type]&&TYPES[p.type].plant&&gap(o,p)<=80);
function conflicts(o){
  const out=new Map();const mine=o.zones.filter(z=>z.crop);
  mine.forEach((z,i)=>mine.slice(i+1).forEach(z2=>{if(compat(z.crop,z2.crop)<0)out.set(rk(z.crop,z2.crop)+'|in',{a:z.crop,b:z2.crop,where:'dans la même planche'})}));
  neighbors(o).forEach(n=>mine.forEach(z=>n.zones.forEach(z2=>{if(z2.crop&&compat(z.crop,z2.crop)<0)out.set(rk(z.crop,z2.crop)+n.id,{a:z.crop,b:z2.crop,where:'avec '+n.name})})));

}

  return(o.grown||[]).filter(g=>g.y<Y&&g.y>=Y-ROT_YEARS&&P[g.crop]&&g.crop!=='fraise'&&P[g.crop].f===f).sort((a,b)=>b.y-a.y)[0]||null}
function rotIssues(o){const out=[];o.zones.forEach(z=>{const r=rotIssue(o,z.crop,yearOf(z));if(r)out.push({crop:z.crop,prev:r})});return out}
function recordGrown(o,crop,y){if(!crop)return;o.grown=o.grown||[];if(!o.grown.some(g=>g.y===y&&g.crop===crop))o.grown.push({y,crop})}

  const good=new Set(),bad=new Set();
  present.forEach(c=>PLANTS.forEach(p=>{const r=compat(c,p.id);if(r>0)good.add(p.id);if(r<0)bad.add(p.id)}));

}

/* ================= Soleil & ombres ================= */
function sunPos(doy,hour){const d=23.44*Math.sin(2*Math.PI*(284+doy)/365)*Math.PI/180,H=(hour-12)*15*Math.PI/180;
  const alt=Math.asin(Math.sin(LAT)*Math.sin(d)+Math.cos(LAT)*Math.cos(d)*Math.cos(H));
  const az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(LAT)-Math.tan(d)*Math.cos(LAT))+Math.PI;return{alt,az}}

const SUN_NEED={laitue_h:3,tomate:6,poivron:6,aubergine:6,courgette:6,concombre:6,potiron:6,mais:6,haricot:6,basilic:6,fraise:6,pdt:6,
  carotte:4,betterave:4,poireau:4,oignon:5,ail:5,pois:4,feve:4,chou:4,celeri:4,fenouil:5,blette:4,persil:3,laitue:3,epinard:3,mache:3,radis:3};

function zoneCenter(o,zi){let off=0;for(let i=0;i<zi;i++)off+=o.zones[i].len;const L=Math.max(o.w,o.h),u=off+o.zones[zi].len/2-L/2,horiz=o.w>=o.h;
  const lx=horiz?u:0,ly=horiz?0:u,a=o.rot*Math.PI/180;return{x:o.x+o.w/2+lx*Math.cos(a)-ly*Math.sin(a),y:o.y+o.h/2+lx*Math.sin(a)+ly*Math.cos(a)}}
/* jour représentatif : le milieu de la culture, ramené entre avril et mi-septembre */
function growDoy(crop,date){const p=P[crop];let d=doyOf(parse(date||iso(TODAY)))+Math.round((p?p.j:60)/2);d=((d-1)%365)+1;
  if(d>=91&&d<=258)return d;return d>258&&d<=330?258:91}

  const doy=growDoy(crop,date),key=o.id+'|'+zi+'|'+doy;let h=sunCache.get(key);if(h==null){h=sunHoursAt(zoneCenter(o,zi),homeOf(o),o,doy);sunCache.set(key,h)}const need=SUN_NEED[crop];

          for(const k in z.cells){const[r,cc]=k.split('-').map(Number);const[cx,cy]=R(off+(cc+.5)*g.cellL,(r+.5)*g.cellW,0,0);s+=`<circle cx="${cx}" cy="${cy}" r="${Math.min(g.cellL,g.cellW)*.32}" fill="${p.c}"/>`}}

    case 'allee':return`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="s-gravel" stroke-width="1" ${ns}/>`;

/* guides d'alignement */
function alignSnap(o){
  const thr=8/view.z,A=aabb(o),xs=[A.x0,(A.x0+A.x1)/2,A.x1],ys=[A.y0,(A.y0+A.y1)/2,A.y1];let bx=null,by=null;

  for(const B of T){const tx=[B.x0,(B.x0+B.x1)/2,B.x1],ty=[B.y0,(B.y0+B.y1)/2,B.y1];
    for(const a of xs)for(const t of tx){const d=t-a;if(Math.abs(d)<thr&&(!bx||Math.abs(d)<Math.abs(bx.d)))bx={d,v:t,B}}
    for(const a of ys)for(const t of ty){const d=t-a;if(Math.abs(d)<thr&&(!by||Math.abs(d)<Math.abs(by.d)))by={d,v:t,B}}}

function whatPlant(o,zi,date){const z=o.zones[zi],D=parse(date),m=D.getMonth()+1,mN=m%12+1,Y=D.getFullYear(),inS=!!serreOf(o);
  const others=[...new Set([...o.zones.filter((q,i)=>i!==zi&&q.crop).map(q=>q.crop),...neighbors(o).flatMap(n=>n.zones.filter(q=>q.crop).map(q=>q.crop))])];
  const out=[];
  PLANTS.forEach(p=>{if(p.id===z.crop)return;const now=p.m.includes(m),next=p.m.includes(mN);if(!now&&!next)return;
    let sow=now?D:new Date(Y+(mN<m?1:0),mN-1,1,12);
    if(FROST_SENSITIVE.has(p.id)&&!inS){const safe=new Date(sow.getFullYear(),4,15,12);if(sow<safe)sow=safe}
    const hv=addD(iso(sow),p.j);
    if(FROST_SENSITIVE.has(p.id)&&!inS&&hv>new Date(sow.getFullYear(),9,15,12))return;
    let score=0;const rs=[];
    const sc=sunCheck(o,zi,p.id,iso(sow));if(sc){if(sc.lvl==='ok'){score+=2;rs.push(['ok','☀ '+num(sc.h)+' h'])}else if(sc.lvl==='juste')rs.push(['warn','soleil juste']);else{score-=4;rs.push(['bad','trop d\'ombre'])}}
    const ri=rotIssue(o,p.id,Y);if(ri){score-=4;rs.push(['bad','rotation : '+P[ri.crop].n.toLowerCase()+' en '+ri.y])}
    const gd=others.filter(c=>compat(c,p.id)>0),bd=others.filter(c=>compat(c,p.id)<0);
    if(gd.length){score+=Math.min(2,gd.length);rs.push(['ok','ami de '+gd.map(c=>P[c].n.toLowerCase()).join(', ')])}
    if(bd.length){score-=4;rs.push(['bad','gêné par '+bd.map(c=>P[c].n.toLowerCase()).join(', ')])}
    if((S.stock||[]).some(q=>q.cat==='graine'&&q.crop===p.id&&stockOf(q)>0&&!expired(q))){score+=1;rs.push(['ok','graines en stock'])}
    if(nurseryReady().some(n=>n.crop===p.id)){score+=2;rs.push(['ok','plants prêts à repiquer'])}
    if(!now)rs.push(['warn','à partir de '+MONTHS[mN-1]]);
    out.push({p,score,rs,hv,sow:iso(sow)})});
  const clean=out.filter(x=>!x.rs.some(r=>r[0]==='bad'));return(clean.length?clean:out.filter(x=>x.score>-3)).sort((a,b)=>b.score-a.score||a.hv-b.hv).slice(0,6)}

  const all=plantings(),ready=all.filter(x=>x.left<=0),soon=all.filter(x=>x.left>0),mo=TODAY.getMonth()+1;
  const H=allHarvests(),yrs=[...new Set([YEAR,...H.map(h=>h.y)])].sort((a,b)=>b-a);
  const cur=H.filter(h=>h.y===hvYear),tot=cur.reduce((s,h)=>s+h.kg,0);
  const byCrop={},byBed={};cur.forEach(h=>{byCrop[h.crop]=(byCrop[h.crop]||0)+h.kg;byBed[fullName(h.o)]=(byBed[fullName(h.o)]||0)+h.kg});
  const cs=Object.entries(byCrop).sort((a,b)=>b[1]-a[1]),bs=Object.entries(byBed).sort((a,b)=>b[1]-a[1]),mx=cs.length?cs[0][1]:1,mb=bs.length?bs[0][1]:1;
  const cmpY=yrs.slice(0,3).sort((a,b)=>a-b),cmpCrops=[...new Set(H.filter(h=>cmpY.includes(h.y)).map(h=>h.crop))];
  const cell=(c,y)=>H.filter(h=>h.crop===c&&h.y===y).reduce((s,h)=>s+h.kg,0);
  const sow=PLANTS.filter(p=>p.m.includes(mo));
  $('#v-harvest').innerHTML=`<div class="page">
   <h2>Récoltes</h2>
   <div class="stack"><div class="section-t"><span class="lbl">Prêt à récolter</span><span class="mono note">${ready.length}</span></div>
   ${ready.length?`<div class="hvlist">${ready.map(hvRow).join('')}</div><p class="note">Une fois récolté, note le poids dans le journal de la planche puis retire les cases pour libérer la place.</p>`:`<p class="note">Rien n'est encore à maturité.</p>`}</div>
   <div class="stack"><div class="section-t"><span class="lbl">À venir</span><span class="mono note">${soon.length}</span></div>
   ${soon.length?`<div class="hvlist">${soon.map(hvRow).join('')}</div>`:`<p class="note">Aucune récolte en attente. Plante une case dans une planche pour voir apparaître sa date ici.</p>`}</div>
   <div class="stack"><span class="lbl">À semer ou planter en ${MONTHS[mo-1]}</span><div class="chips">${sow.map(p=>chip(p.id)).join('')||'<span class="note">Rien de prévu ce mois-ci.</span>'}</div></div>
   <div class="stack"><div class="section-t"><h2>Carnet de récolte</h2></div>
     <div class="seg">${yrs.map(y=>`<button data-hy="${y}" aria-pressed="${y===hvYear}">${y}</button>`).join('')}</div>
     <div class="stats"><div class="stat"><span class="lbl">Total ${hvYear}</span><span class="v">${num(tot)} <small>kg</small></span></div><div class="stat"><span class="lbl">Cultures récoltées</span><span class="v">${cs.length}</span></div><div class="stat"><span class="lbl">Pesées</span><span class="v">${cur.length}</span></div></div>
     ${cs.length?`<div><span class="lbl">Par culture</span><div class="hbars" style="margin-top:8px">${cs.map(([c,kg])=>`<div class="hbar"><span>${P[c]?P[c].n:c}</span><span class="track"><span style="width:${kg/mx*100}%;background:${P[c]?P[c].c:'var(--accent)'}"></span></span><span class="val">${num(kg)} kg</span></div>`).join('')}</div></div>
     <div><span class="lbl">Par planche</span><div class="hbars" style="margin-top:8px">${bs.map(([b,kg])=>`<div class="hbar"><span>${esc(b)}</span><span class="track"><span style="width:${kg/mb*100}%;background:var(--accent)"></span></span><span class="val">${num(kg)} kg</span></div>`).join('')}</div></div>`:`<p class="note">Aucune pesée en ${hvYear}. Ajoute une récolte depuis le journal d'une planche.</p>`}
     ${cmpCrops.length&&cmpY.length>1?`<div><span class="lbl">Comparaison des saisons (kg)</span><div class="tblwrap" style="margin-top:8px"><table class="cmp"><thead><tr><th>Culture</th>${cmpY.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody>${cmpCrops.map(c=>`<tr><td>${P[c]?P[c].n:c}</td>${cmpY.map((y,i)=>{const v=cell(c,y),pv=i?cell(c,cmpY[i-1]):0;return`<td class="${i&&v&&pv?(v>pv?'up':v<pv?'down':''):''}">${v?num(v):'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`:''}
   </div>
   <p class="note">Dans l'app native, chaque date de récolte deviendra une notification sur le téléphone.</p>
  </div>`;
}
$('#v-harvest').addEventListener('click',e=>{const y=e.target.closest('[data-hy]');if(y){hvYear=+y.dataset.hy;return renderHarvest()}const b=e.target.closest('[data-open]');if(b)openBed(b.dataset.open,+b.dataset.zi)});

/* ================= Eau & gel ================= */
function frostPeriod(d){const m=d.getMonth()+1,dd=d.getDate();
  if(m>=11||m<=3)return{lvl:2,txt:'Gel probable la nuit'};
  if(m===10)return{lvl:1,txt:'Premières gelées possibles (souvent mi-octobre en Hesbaye)'};
  if(m===4||(m===5&&dd<=15))return{lvl:1,txt:'Gelées tardives possibles jusqu\'aux Saints de glace (11–13 mai)'};
  return{lvl:0,txt:'Pas de gel attendu à cette période'}}
function cultivated(){let a=0;const per=[];plantables().forEach(o=>{let ao=0;o.zones.forEach(z=>{if(z.crop&&Object.keys(z.cells).length)ao+=zoneArea(o,z)});if(ao){a+=ao;per.push({o,a:ao})}});return{a,per}}
function renderWeather(){
  const fp=frostPeriod(TODAY),mo=TODAY.getMonth();
  const sens=[];plantables().forEach(o=>o.zones.forEach(z=>{if(z.crop&&FROST_SENSITIVE.has(z.crop)&&Object.keys(z.cells).length)sens.push({o,z})}));
  const fr=S.frost&&S.frost.d===iso(TODAY)?S.frost.t:'',frSrc=S.frost&&S.frost.d===iso(TODAY)&&S.frost.src==='station';
  const danger=fr!==''&&+fr<=2;
  let frost=`<div class="alert ${danger?'':'frost'}"><span><b>${fp.txt}.</b> ${sens.length?`${sens.length} culture${sens.length>1?'s':''} sensible${sens.length>1?'s':''} en place.`:'Aucune culture sensible en place.'}</span>
    ${danger&&sens.length?`<span>Minimum prévu ${num(fr)} °C : couvre ou rentre ${sens.map(s=>`<b>${P[s.z.crop].n.toLowerCase()}</b> (${esc(fullName(s.o))}${serreOf(s.o)?', serre non chauffée':''})`).join(', ')} ce soir. Un voile d'hivernage P30 gagne environ 2 à 4 °C.</span>`:''}
    ${fr!==''&&!danger?`<span>Minimum prévu ${num(fr)} °C : pas de protection nécessaire cette nuit.</span>`:''}</div>
    ${sens.length?`<div class="chips">${sens.map(s=>`<span class="chip"><i style="background:${P[s.z.crop].c}"></i>${P[s.z.crop].n} · ${esc(fullName(s.o))}</span>`).join('')}</div>`:''}
    <label class="field" style="max-width:260px"><span class="lbl">Minimum prévu cette nuit (°C)${frSrc?' · prévision automatique':''}</span><input id="w-tmin" type="number" step="0.5" value="${fr}" placeholder="selon ta météo"></label>`;
  const tc=tankCap();if(tc){S.water.cap=tc.cap;if(S.water.level>tc.cap)S.water.level=tc.cap}
  const w=S.water,cu=cultivated(),eff=.85;
  const collect=RAIN.map(mm=>w.roof*mm*eff),need=NEED.map(n=>cu.a*n*30/7);
  const wkC=collect[mo]/30*7,wkN=cu.a*NEED[mo],bal=wkC-wkN;
  const auto=bal<0?Math.floor(w.level/(-bal/7)):null;
  /* graphique : 12 mois, deux séries */
  const max=Math.max(...collect,...need,1),nice=Math.ceil(max/500)*500||500,Wc=360,Hc=180,pl=40,pb=20,bw=(Wc-pl)/12;
  let ch=`<svg class="chart" viewBox="0 0 ${Wc} ${Hc+pb}" role="img" aria-label="Pluie récupérée et besoin d'arrosage par mois">`;
  for(let i=0;i<=4;i++){const v=nice*i/4,y=Hc-v/nice*(Hc-10);ch+=`<line class="gl" x1="${pl}" x2="${Wc}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-6}" y="${y+3}" text-anchor="end">${v>=1000?num(v/1000)+' k':Math.round(v)}</text>`}
  collect.forEach((c,i)=>{const x=pl+i*bw,h1=c/nice*(Hc-10),h2=need[i]/nice*(Hc-10);
    ch+=`<rect class="b1" x="${x+bw*.12}" y="${Hc-h1}" width="${bw*.36}" height="${h1}" rx="1.5"/><rect class="b2" x="${x+bw*.52}" y="${Hc-h2}" width="${bw*.36}" height="${h2}" rx="1.5"/><text class="ax" x="${x+bw/2}" y="${Hc+14}" text-anchor="middle" ${i===mo?'style="font-weight:600;fill:var(--ink)"':''}>${MSHORT[i]}</text>`});
  ch+=`</svg>`;
  
  $('#v-weather').innerHTML=`<div class="page">
   ${WU.get().key||wx?`<div class="tcard"><div class="row between"><h3>${WU.get().key?'Ma station':'Météo'}</h3><button class="btn small" data-wact="wusync">${wxBusy?'…':'Actualiser'}</button></div>${wx?stationLine():'<span class="note">Lecture en cours…</span>'}
     ${wx&&wx.fcErr?`<span class="note" style="color:var(--danger)">${esc(wx.fcErr)}</span>`:''}${wx&&wx.fc?`<span class="lbl">Prévisions (Open-Meteo)</span><div class="mths" style="grid-template-columns:repeat(${Math.min(5,wx.fc.length)},1fr);gap:6px;font-size:12px">${wx.fc.slice(0,5).map(f=>`<div style="display:grid;gap:2px;text-align:center;padding:6px 2px;border-radius:8px;background:var(--surface-2)"><b style="color:var(--ink)">${esc((f.dow||'').slice(0,3))}</b><span>${f.min!=null?num(f.min,0):'–'}° / ${f.max!=null?num(f.max,0):'–'}°</span><span style="color:var(--water)">${num(f.mm||0,1)} mm</span></div>`).join('')}</div>`:''}</div>`
   :`<div class="tcard"><h3>Ma station</h3><span class="note">Relie ta station Weather Underground pour noter la pluie automatiquement et recevoir l'alerte gel sur prévision.</span><button class="btn small primary" data-wact="wuconf" style="justify-self:start">Relier ma station</button></div>`}
   <h2>Gel</h2>${frost}
   <p class="note">Les seuils viennent du calendrier climatique de la Hesbaye. L'alerte automatique sur les prévisions arrivera avec l'app native ou une station météo reliée.</p>
   <h2>Pluie</h2>
   <div class="row"><button class="btn primary" data-wact="rain">Il a plu aujourd'hui</button><label class="field" style="width:120px"><span class="lbl">Quantité (mm)</span><input id="r-mm" type="number" min="0" step="0.5" placeholder="facultatif"></label></div>
   ${(S.rain||[]).length?`<div class="jlist">${S.rain.slice(0,6).map(r=>`<div class="jent"><span class="d">${fdate(parse(r.d))}</span><div>${r.mm!=null?`<span class="mono">${num(r.mm)} mm</span>`:'Pluie'}${r.src==='station'?' <span class="note">· station</span>':''}${r.mm!=null&&r.mm<RAIN_MIN?' <span class="note">· trop faible pour compter comme arrosage</span>':''}</div><button class="del" data-wact="rdel" data-id="${r.id}" aria-label="Supprimer">×</button></div>`).join('')}</div>`:'<p class="note">Aucune pluie notée.</p>'}
   <p class="note">Une pluie de ${RAIN_MIN} mm ou plus, ou sans quantité, compte comme un arrosage pour les planches en plein air. La page ne peut pas lire la météo elle-même : la station météo ou l'app native le feront automatiquement.</p>
   <h2>Eau</h2>
   <div class="grid3"><label class="field"><span class="lbl">Toit raccordé (m²)</span><input id="w-roof" type="number" min="0" step="1" value="${w.roof}"></label>
   ${tc?`<div class="field"><span class="lbl">Capacité (L)</span><span class="mono" style="padding-top:9px">${num(tc.cap,0)} L</span><span class="note">calculée sur ${tc.n} cuve${tc.n>1?'s':''} du plan</span></div>`:`<label class="field"><span class="lbl">Capacité cuve (L)</span><input id="w-cap" type="number" min="0" step="100" value="${w.cap}"></label>`}
   <label class="field"><span class="lbl">Niveau actuel (L)</span><input id="w-level" type="number" min="0" max="${w.cap}" step="50" value="${w.level}"></label></div>
   <div class="stats"><div class="stat"><span class="lbl">Surface cultivée</span><span class="v">${num(cu.a)} <small>m²</small></span></div>
   <div class="stat"><span class="lbl">Récupéré / sem. (${MONTHS[mo]})</span><span class="v">${num(wkC,0)} <small>L</small></span></div>
   <div class="stat"><span class="lbl">Besoin / sem.</span><span class="v">${num(wkN,0)} <small>L</small></span></div>
   <div class="stat"><span class="lbl">Autonomie cuve</span><span class="v">${auto==null?'∞':auto} <small>${auto==null?'':'jours'}</small></span></div></div>
   <p class="note">${auto==null?'La pluie récupérée couvre le besoin estimé ce mois-ci.':`Au rythme moyen de ${MONTHS[mo]}, la cuve se vide en ${auto} jours sans pluie supplémentaire.`} Niveau : ${Math.round(w.level/Math.max(1,w.cap)*100)} % de ${num(w.cap,0)} L.</p>
   <div><div class="section-t"><span class="lbl">Litres par mois</span><span class="legend"><span><i style="background:var(--water)"></i>Pluie récupérée</span><span><i style="background:var(--sun)"></i>Besoin d'arrosage</span></span></div>${ch}</div>
   ${cu.per.length?`<div class="stack"><span class="lbl">Arrosage indicatif cette semaine</span><div class="hvlist">${cu.per.map(x=>{const lw=lastWater(x.o),th=thirsty(x.o);return`<button class="hv" data-open="${x.o.id}" data-zi="0"><span class="dot" style="background:var(--water)"></span><span><span class="t">${esc(fullName(x.o))}</span> <span class="s">· ${num(x.a)} m² cultivés</span><span class="s" style="display:block${th?';color:var(--water);font-weight:700':''}">${waterText(lw)}${th?' · à arroser':''}</span></span><span class="due">${num(x.a*NEED[mo],0)} L</span></button>`}).join('')}</div></div>`:''}
   <p class="note">Pluie : moyennes mensuelles régionales, rendement de toiture 85 %. Besoin : 0 à 20 L/m² par semaine selon le mois. Les capteurs d'humidité et la station météo remplaceront ces moyennes par tes mesures.</p>
  </div>`;
}
$('#v-weather').addEventListener('change',e=>{const t=e.target,v=parseFloat(t.value);
  if(t.id==='w-tmin'){S.frost=t.value===''?null:{t:v,d:iso(TODAY)};save();renderWeather()}
  if(['w-roof','w-cap','w-level'].includes(t.id)&&!isNaN(v)){S.water[t.id.slice(2)]=Math.max(0,v);if(S.water.level>S.water.cap)S.water.level=S.water.cap;save();renderWeather()}});
$('#v-weather').addEventListener('click',e=>{const wa=e.target.closest('[data-wact]');
  if(wa&&wa.dataset.wact==='wusync'){syncStation(true);return}
  if(wa&&wa.dataset.wact==='wuconf'){setTab('plan');sheetMode='wu';selId=null;renderSheet();return}
  if(wa&&wa.dataset.wact==='rain'){const v=parseFloat(String($('#r-mm').value).replace(',','.'));addRain(isNaN(v)?null:v);save();renderWeather();return toast('Pluie notée',true)}
  if(wa&&wa.dataset.wact==='rdel'){S.rain=S.rain.filter(r=>r.id!==wa.dataset.id);save();renderWeather();return toast('Pluie supprimée',true)}
  const b=e.target.closest('[data-open]');if(b)openBed(b.dataset.open,0)});

/* ================= Ravageurs et maladies de saison ================= */
const PESTS=[
 {n:'Doryphore',c:['pdt','aubergine','tomate'],m:[5,6,7,8],t:'Inspecte le revers des feuilles, écrase les pontes orange et ramasse les adultes.'},
 {n:'Mildiou',c:['tomate','pdt'],m:[6,7,8,9],t:'Évite de mouiller le feuillage, aère, retire les feuilles tachées dès les premiers signes.'},
 {n:'Piéride du chou',c:['chou'],m:[5,6,7,8,9],t:'Un filet anti-insectes empêche la ponte ; retire les chenilles à la main.'},
 {n:'Altise',c:['radis','chou'],m:[4,5,6],t:'Garde le sol frais par des arrosages légers, un voile protège les jeunes plants.'},
 {n:'Mouche de la carotte',c:['carotte','persil','celeri'],m:[5,6,8,9],t:'Voile anti-insectes, et évite d\'éclaircir par temps calme.'},
 {n:'Teigne du poireau',c:['poireau','oignon','ail'],m:[4,5,8,9,10],t:'Voile anti-insectes en période de vol, coupe les feuilles atteintes.'},
 {n:'Mouche de l\'oignon',c:['oignon','poireau'],m:[5,6],t:'Voile, et associe avec les carottes.'},
 {n:'Puceron noir',c:['feve','haricot'],m:[4,5,6],t:'Pince la tête des fèves dès l\'apparition des colonies ; savon noir si besoin.'},
 {n:'Limaces',c:['laitue','laitue_h','chou','courgette','fraise','mache','epinard','haricot'],m:[3,4,5,6,9,10],t:'Ronde le soir après la pluie, pièges à bière, paillage sec autour des plants.'},
 {n:'Oïdium',c:['courgette','concombre','potiron','pois'],m:[7,8,9],t:'Arrose au pied, retire les feuilles blanches ; le soufre agit en préventif.'},
 {n:'Botrytis',c:['fraise','laitue','laitue_h','tomate'],m:[5,6,9,10],t:'Aère, retire les parties pourries, évite les arrosages tardifs.'}];
function pestsNow(){const mo=TODAY.getMonth()+1,inPlace=[];plantables().forEach(o=>o.zones.forEach(z=>{if(z.crop&&Object.keys(z.cells).length)inPlace.push({o,crop:z.crop})}));
  return PESTS.filter(p=>p.m.includes(mo)).map(p=>({...p,where:inPlace.filter(x=>p.c.includes(x.crop))})).filter(p=>p.where.length)}
const MABR=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const mRange=ms=>{const a=Math.min(...ms),b=Math.max(...ms);return MABR[a-1]+(a!==b?'–'+MABR[b-1]:'')};

/* ================= Aujourd'hui ================= */
function renderToday(){
  const mo=TODAY.getMonth()+1,pl=plantings(),fp=frostPeriod(TODAY);
  const fr=S.frost&&S.frost.d===iso(TODAY)?+S.frost.t:null;
  const pests=pestsNow(),nr=nurseryReady(),act=nurseryActive(),lows=(S.stock||[]).filter(isLow);
  const hasSeeds=id=>(S.stock||[]).some(q=>q.cat==='graine'&&q.crop===id&&stockOf(q)>0&&!expired(q));
  const row=(color,main,sub,right,attrs)=>`<button class="trow" ${attrs}><i style="background:${color}"></i><span><b>${main}</b>${sub?` <span class="note">· ${sub}</span>`:''}</span>${right}</button>`;
  /* une section par lieu : plein air, chaque serre */
  const locs=[{key:'out',t:'Planches en plein air',ico:'<path d="M4 20h16M6 20V10M18 20V10M3 10l9-6 9 6"/>',f:o=>!serreOf(o)}];
  S.objs.filter(o=>o.type==='serre').forEach(se=>locs.push({key:se.id,t:se.name,ico:'<path d="M3 20V11a9 9 0 0 1 18 0v9z"/><path d="M12 2v18M3 14h18"/>',f:o=>serreOf(o)===se,serre:true}));
  let nAct=0;
  const secs=locs.map(L=>{const pls=plantables().filter(L.f),mine=pl.filter(x=>pls.includes(x.o));
    const ready=mine.filter(x=>x.left<=0&&!x.bu),blocked=mine.filter(x=>x.left<=0&&x.bu),th=pls.filter(o=>thirsty(o));
    const sens=[];pls.forEach(o=>o.zones.forEach(z=>{if(z.crop&&FROST_SENSITIVE.has(z.crop)&&Object.keys(z.cells).length)sens.push({o,z})}));
    const pe=pests.map(p=>({...p,where:p.where.filter(w=>pls.includes(w.o))})).filter(p=>p.where.length);
    const free=[];pls.forEach(o=>o.zones.forEach((z,i)=>{if(!z.crop)free.push({o,i,z})}));
    const c=[];
    if(fp.lvl>0&&sens.length){const danger=fr!=null&&fr<=2;c.push(`<div class="tcard ${L.serre?'':'frost'}"><h3>Gel${fr!=null?` · ${num(fr)} °C prévus`:''}</h3><span>${L.serre?'Serre non chauffée : protège d\'un voile si une nuit sous −2 °C est annoncée. Cultures sensibles :':danger?'Couvre ou rentre ce soir :':fp.txt+'. Cultures sensibles :'} ${sens.map(x=>`<b>${P[x.z.crop].n.toLowerCase()}</b> (${esc(x.o.name)})`).join(', ')}.</span>${fr==null&&!L.serre?'<button class="btn small" data-tgo="weather" style="justify-self:start">Indiquer le minimum prévu</button>':''}</div>`);nAct++}
    if(ready.length){c.push(`<div class="tcard"><h3>À récolter <span class="n">${ready.length}</span></h3>${ready.map(x=>row(x.p.c,x.p.n,esc(x.o.name),`<span class="due ready">${x.left<-14?'depuis '+(-x.left)+' j':'prêt'}</span>`,`data-open="${x.o.id}" data-zi="${x.zi}"`)).join('')}</div>`);nAct+=ready.length}
    if(blocked.length)c.push(`<div class="tcard"><h3>Récolte à attendre</h3>${blocked.map(x=>row(x.p.c,x.p.n,esc(x.o.name)+' · délai après traitement',`<span class="due blocked">${fdate(x.bu)}</span>`,`data-open="${x.o.id}" data-zi="${x.zi}"`)).join('')}</div>`);

const WU_DEFAULT={id:'IGHEZE29',key:'6fffe640ff8c4e82bfe640ff8cfe8292'};
const WU={get(){try{const v=JSON.parse(localStorage.getItem('potager-wu'));return v&&v.key?v:(v&&v.off?{}:WU_DEFAULT)}catch(e){return WU_DEFAULT}},set(v){try{localStorage.setItem('potager-wu',JSON.stringify(v))}catch(e){}}};
let wx=null,wxBusy=false;
const inClaude=()=>!!window.claude||/claude\.ai|claudeusercontent/.test(location.hostname);
async function wuFetch(path,c){const u=`https://api.weather.com${path}${path.includes('?')?'&':'?'}apiKey=${encodeURIComponent(c.key)}&format=json&units=m&numericPrecision=decimal`;
  let r;try{r=await fetch(u)}catch(e){throw new Error(inClaude()?'La station ne se lit que dans l\'app installée, pas dans Claude.':'Station injoignable : vérifie la connexion internet.')}
  if(r.status===401||r.status===403)throw new Error('Clé API refusée par Weather Underground.');
  if(r.status===204)throw new Error('Aucune donnée : vérifie l\'identifiant de la station, ou elle est hors ligne.');
  if(!r.ok)throw new Error('Weather Underground a répondu ' + r.status + '.');return r.json()}
/* Prévisions publiques Open-Meteo (gratuites, sans clé) : minimum de la nuit et 5 jours */
const HOME_GEO={lat:50.586,lon:4.877};
async function forecastOM(lat,lon){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_min,temperature_2m_max,precipitation_sum,weather_code&hourly=temperature_2m&current=temperature_2m,weather_code,is_day,wind_speed_10m,precipitation&timezone=Europe%2FBrussels&forecast_days=6`;
  let r;try{r=await fetch(u)}catch(e){throw new Error(inClaude()?'Les prévisions ne se lisent que dans l\'app installée.':'Prévisions injoignables : vérifie la connexion.')}
  if(!r.ok)throw new Error('Prévisions indisponibles ('+r.status+').');const j=await r.json();
  const t0=iso(TODAY)+'T18:00',t1=iso(addD(iso(TODAY),1))+'T09:00';let night=null;
  (j.hourly&&j.hourly.time||[]).forEach((t,i)=>{if(t>=t0&&t<=t1){const v=j.hourly.temperature_2m[i];if(v!=null&&(night==null||v<night))night=v}});
  const dn=['dim','lun','mar','mer','jeu','ven','sam'];
  const fc=(j.daily&&j.daily.time||[]).slice(0,5).map((d,i)=>({d,dow:dn[parse(d).getDay()],min:j.daily.temperature_2m_min[i],max:j.daily.temperature_2m_max[i],mm:j.daily.precipitation_sum[i],code:(j.daily.weather_code||[])[i]}));
  const cu=j.current||{};return{night,fc,cur:{code:cu.weather_code,isDay:cu.is_day!==0,t:cu.temperature_2m,wind:cu.wind_speed_10m}}}
async function syncStation(manual,cfg){const c=cfg||WU.get();if(wxBusy&&!cfg)return;wxBusy=true;
  try{
    /* 1. la station (mesures et pluie) */
    let now=null,lat=HOME_GEO.lat,lon=HOME_GEO.lon,stErr=null,days=null;
    if(c.id&&c.key){try{const sid=encodeURIComponent(c.id.trim());
        const cur=await wuFetch(`/v2/pws/observations/current?stationId=${sid}`,c),ob=cur&&cur.observations&&cur.observations[0];if(!ob)throw new Error('Aucune observation récente pour cette station.');
        const m=ob.metric||{};now={t:m.temp,h:ob.humidity,rain:m.precipTotal,wind:m.windSpeed,time:ob.obsTimeLocal};if(ob.lat)lat=ob.lat;if(ob.lon)lon=ob.lon;
        try{days=await wuFetch(`/v2/pws/dailysummary/7day?stationId=${sid}`,c)}catch(e){}}
      catch(e){if(cfg)throw e;stErr=e.message}}
    if(cfg)return{now};
    /* 2. les prévisions publiques */
    let f=null,fcErr=null;try{f=await forecastOM(lat,lon)}catch(e){fcErr=e.message}
    wx={now,err:stErr,fcErr,night:f?f.night:null,fc:f?f.fc:null,cur:f?f.cur:null,at:Date.now(),id:c.id};
    let changed=false;S.rain=S.rain||[];
    if(now){const put=(d,mm)=>{mm=Math.round((+mm||0)*10)/10;const ex=S.rain.find(r=>r.d===d&&r.src==='station');
        if(mm<0.2){if(ex){S.rain=S.rain.filter(r=>r!==ex);changed=true}return}
        if(ex){if(ex.mm!==mm){ex.mm=mm;changed=true}}else{S.rain.push({id:uid(),d,mm,src:'station'});changed=true}};
      ((days&&days.summaries)||[]).forEach(x=>{if(x.obsTimeLocal&&x.metric)put(x.obsTimeLocal.slice(0,10),x.metric.precipTotal)});
      put(iso(TODAY),now.rain)}
    const night=wx.night!=null?Math.round(wx.night*10)/10:null;
    if(night!=null&&(!S.frost||S.frost.d!==iso(TODAY)||S.frost.src==='station')&&!(S.frost&&S.frost.d===iso(TODAY)&&S.frost.t===night)){S.frost={t:night,d:iso(TODAY),src:'station'};changed=true}
    if(changed){S.rain.sort((a,b)=>b.d.localeCompare(a.d));save()}
    if(manual)toast(stErr||fcErr||'Météo à jour');refresh();return wx}
  finally{wxBusy=false}}

function wxIcon(kind,day=true,anim=true){const A=anim?' wxa':'';

    case'showers':g=so(28,26,9)+cloud(44,42,1)+drops(3,'wrain');break;
    case'snow':g=cloud(42,42,1)+flakes;break;
    case'storm':g=cloud(42,40,1.05,'wdark')+bolt+drops(2,'wrain');break}
  return`<svg class="wxi" viewBox="0 0 80 80" aria-hidden="true">${g}</svg>`}
function weatherHero(){if(!wx)return'';const cur=wx.cur,kind=cur&&cur.code!=null?wxKind(cur.code):null,day=cur?cur.isDay:true;
  const t=wx.now&&wx.now.t!=null?wx.now.t:cur?cur.t:null;if(t==null&&!kind)return wx.err||wx.fcErr?`<div class="wxhero"><span class="note">${esc(wx.err||wx.fcErr)}</span></div>`:'';
  const frosty=wx.night!=null&&wx.night<=2,rainToday=wx.now&&wx.now.rain!=null?wx.now.rain:null;
  const bits=[wx.night!=null?`<span class="${frosty?'wfrost':''}">Nuit ${num(wx.night,1)} °C${frosty?' · gel possible':''}</span>`:'',rainToday!=null?`<span>Pluie ${num(rainToday,1)} mm</span>`:'',wx.now&&wx.now.h!=null?`<span>${wx.now.h} %</span>`:'',(cur&&cur.wind!=null)?`<span>Vent ${num(cur.wind,0)} km/h</span>`:''].filter(Boolean).join('');
  return`<button class="wxhero ${kind||'cloudy'}${day?'':' night'}" data-tgo="weather" aria-label="Voir la météo détaillée">
    <div class="wxmain">${kind?wxIcon(kind,day,true):''}<div class="wxt"><span class="wxdeg">${t!=null?num(t,1):'–'}<small>°C</small></span><span class="wxlbl">${kind?WX_TXT[kind]:''}${wx.now?' · <span class="note">station '+esc(wx.id||'')+'</span>':''}</span></div></div>
    ${bits?`<div class="wxbits">${bits}</div>`:''}
    ${wx.fc?`<div class="wxdays">${wx.fc.slice(0,5).map((f,i)=>`<div class="wxd"><span>${i===0?'Auj.':esc((f.dow||'').slice(0,3))}</span>${f.code!=null?wxIcon(wxKind(f.code),true,false):''}<b>${f.max!=null?num(f.max,0):'–'}°</b><span class="note">${f.min!=null?num(f.min,0):'–'}°</span></div>`).join('')}</div>`:''}
  </button>`}
addEventListener('visibilitychange',()=>{if(!document.hidden&&(!wx||Date.now()-wx.at>30*60000))syncStation(false)});

/* ================= Démarrage ================= */
function themePref(){try{return localStorage.getItem('potager-theme')||'auto'}catch(e){return'auto'}}
function setTheme(k){try{localStorage.setItem('potager-theme',k)}catch(e){}applyTheme()}
function applyTheme(){const k=themePref(),r=document.documentElement;if(k==='auto')delete r.dataset.theme;else r.dataset.theme=k;
  const dark=k==='dark'||(k==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content',dark?'#1d1e20':'#fafbf6'))}
applyTheme();
let seenHelp=false;try{seenHelp=!!localStorage.getItem('potager-aide-vue');localStorage.setItem('potager-aide-vue','1')}catch(e){}
if(!seenHelp)sheetMode='help';
renderHeader();requestAnimationFrame(()=>{fit();renderSheet();setTab('today')});
initCaps();
setTimeout(()=>syncStation(false),600);
</script>
