<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}

img{max-width:100%}
[hidden]{display:none!important}
#splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;align-content:center;gap:14px;background:#2c6a39;color:#fff;font:700 22px/1.2 system-ui,-apple-system,sans-serif;transition:opacity .45s ease,visibility .45s}

<style>
/* Layout: one-screen app — header, full-bleed plan canvas with a bottom sheet, bottom tab bar. Plan reads like a surveyor's sheet on sage paper. */
:root{
  --bg:#e9ede1; --surface:#fafbf6; --surface-2:#f1f3ea; --ink:#1d271b; --muted:#5d6955; --line:#cdd4c1;
  --accent:#2c6a39; --accent-ink:#ffffff; --sun:#d9951c; --grid:rgba(44,106,57,.10); --grid-strong:rgba(44,106,57,.22);
  --ground:#dfe6cf; --soil:#8b6a48; --soil-edge:#5e4529; --water:#3a82b5; --leaf:#5c9a45; --leaf-dark:#2f5d2b;
  --gravel:#cdc6b5; --wood:#a3713f; --danger:#b8392b; --ok:#2e8547; --halo:#fafbf6; --shade:rgba(22,32,60,.30); --frost:#3a6fb5;
  --sky1:#fdf4dc; --sky2:#e3efe0; --skyr1:#e3ebf3; --skyr2:#eef1ea; --skyc1:#edefec; --skyc2:#e6e9e2; --skyn1:#2a3350; --skyn2:#3c4766; --glass:rgba(255,255,255,.6);
  --sunc:#f2a91d; --moonc:#f3e7b8; --cloudc:#ffffff; --cloudl:#c9d1d6; --cloudb:#e6eaee; --cloudd:#aab4bf; --snowc:#ffffff; --boltc:#f5c330;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141516; --surface:#1d1e20; --surface-2:#26282a; --ink:#ebe8e2; --muted:#a19e96; --line:#34363a;
  --accent:#7cbf6a; --accent-ink:#10150f; --sun:#f0b445; --grid:rgba(255,255,255,.045); --grid-strong:rgba(255,255,255,.10);
  --ground:#1f2221; --soil:#6b5038; --soil-edge:#3f2c1a; --water:#4f9bd0; --leaf:#4c8a3a; --leaf-dark:#2c5226;
  --gravel:#46443f; --wood:#8a6038; --danger:#ee6a58; --ok:#6fca7a; --halo:#1d1e20; --shade:rgba(0,0,0,.45); --frost:#7fb0ee; --sky1:#2a2a22; --sky2:#1f2621; --skyr1:#1e2530; --skyr2:#1d2023; --skyc1:#232527; --skyc2:#1d1f21; --skyn1:#151a2b; --skyn2:#20263a; --glass:rgba(255,255,255,.08);
  --sunc:#f5b638; --moonc:#efe2ad; --cloudc:#cfd5db; --cloudl:#8d969e; --cloudb:#9aa3ab; --cloudd:#7c8792; --snowc:#f2f5f7; --boltc:#f7cf4a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141516; --surface:#1d1e20; --surface-2:#26282a; --ink:#ebe8e2; --muted:#a19e96; --line:#34363a;
  --accent:#7cbf6a; --accent-ink:#10150f; --sun:#f0b445; --grid:rgba(255,255,255,.045); --grid-strong:rgba(255,255,255,.10);
  --ground:#1f2221; --soil:#6b5038; --soil-edge:#3f2c1a; --water:#4f9bd0; --leaf:#4c8a3a; --leaf-dark:#2c5226;
  --gravel:#46443f; --wood:#8a6038; --danger:#ee6a58; --ok:#6fca7a; --halo:#1d1e20; --shade:rgba(0,0,0,.45); --frost:#7fb0ee; --sky1:#2a2a22; --sky2:#1f2621; --skyr1:#1e2530; --skyr2:#1d2023; --skyc1:#232527; --skyc2:#1d1f21; --skyn1:#151a2b; --skyn2:#20263a; --glass:rgba(255,255,255,.08);
  --sunc:#f5b638; --moonc:#efe2ad; --cloudc:#cfd5db; --cloudl:#8d969e; --cloudb:#9aa3ab; --cloudd:#7c8792; --snowc:#f2f5f7; --boltc:#f7cf4a; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);max-width:1100px;margin:0 auto;position:relative}

.top{display:flex;align-items:center;gap:8px;padding-block:10px;padding-inline:16px;border-bottom:1px solid var(--line);background:var(--surface)}
.top>div:first-child{min-width:0;flex:1 1 auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:99px;background:var(--sun);color:#1d1404;font-weight:700}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn:disabled{opacity:.35}
.iconbtn.on{background:var(--sun);border-color:var(--sun);color:#1d1404}

main{position:relative;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto}

#map{width:100%;height:100%;display:block;touch-action:none;background:var(--bg);user-select:none;-webkit-user-select:none}
.s-stream{stroke:var(--water);stroke-opacity:.75}.s-flow{stroke:#fff;stroke-opacity:.7}
.vol{fill:var(--water);font-family:var(--f-mono);font-weight:600}
@media (prefers-reduced-motion:no-preference){.s-flow{animation:flow 2.4s linear infinite}}
@keyframes flow{to{stroke-dashoffset:-60}}
.surround{fill:var(--leaf);fill-opacity:.10;stroke:var(--line);stroke-width:1;stroke-dasharray:6 4}
.ground{fill:var(--ground)} .bound{fill:none;stroke:var(--accent);stroke-width:1.5}
.dimtxt{fill:var(--muted);font-family:var(--f-mono)}
.obj{cursor:grab}.obj.nopick{cursor:inherit}
.obj text{font-family:var(--f-body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.s-soil{fill:var(--soil);stroke:var(--soil-edge)} .s-wood{fill:var(--soil);stroke:var(--wood)}
.s-water{fill:var(--water);fill-opacity:.85;stroke:var(--water)} .s-water-l{fill:var(--water);fill-opacity:.25;stroke:var(--water)}
.s-leaf{fill:var(--leaf);fill-opacity:.35;stroke:var(--leaf-dark)} .s-leaf-solid{fill:var(--leaf-dark);stroke:var(--leaf-dark)}
.s-trunk{fill:var(--wood)} .s-gravel{fill:var(--gravel);stroke:var(--line)} .s-serre{fill:var(--water);fill-opacity:.10;stroke:var(--water);stroke-dasharray:6 4}
.s-wood-solid{fill:var(--wood);stroke:var(--soil-edge)} .s-fence{fill:var(--wood);stroke:none} .s-plug{fill:var(--sun);stroke:var(--ink)}
.s-roof{stroke:var(--soil-edge);fill:none} .s-zone-line{stroke:var(--halo);stroke-opacity:.7}
.selbox{fill:none;stroke:var(--sun);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.selbox.locked{stroke:var(--muted);stroke-dasharray:2 3}
.handle{fill:var(--sun);stroke:var(--surface);stroke-width:2;cursor:nwse-resize}
.badge circle{stroke:var(--surface);stroke-width:1.5} .badge text{fill:#fff;font-family:var(--f-mono);font-weight:600;stroke:none}
.badge.red circle{fill:var(--danger)} .badge.amber circle{fill:var(--sun)} .badge.amber text{fill:#1d1404}
.obj.lift{filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.obj.lift .selbox{stroke-dasharray:none;stroke-width:3}
.shadepoly{fill:var(--shade);pointer-events:none}
.shadepoly.live{opacity:.55}
.wxlayer{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;transition:background .8s}
.wxlayer.night{background:rgba(14,22,52,.26)}
.wxlayer.frost{box-shadow:inset 0 0 70px rgba(185,220,255,.75);background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.35) 0 1px,transparent 2px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.3) 0 1px,transparent 2px);background-size:46px 46px,63px 63px}
.wxlayer.night.frost{background-color:rgba(14,22,52,.26)}
.wxlayer.wet{background-color:rgba(70,95,125,.10)}
.wxlayer.foggy{background-color:rgba(220,224,226,.22)}
.wxlayer .dr{position:absolute;top:-30px;width:1.6px;height:18px;border-radius:1px;background:linear-gradient(rgba(110,150,200,0),rgba(110,150,200,.75));transform:rotate(12deg)}
.wxlayer.heavy .dr{width:2px;height:24px}
.wxlayer .fl{position:absolute;top:-10px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 3px rgba(0,0,0,.15)}
.wxlayer .fg{position:absolute;left:-30%;width:160%;height:40%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(240,242,243,.55),transparent 70%);filter:blur(6px)}
.wxlayer .fg.a{top:15%} .wxlayer .fg.b{top:55%}
.wxlayer .flash{position:absolute;inset:0;background:#fff;opacity:0}
@media (prefers-reduced-motion:no-preference){
 .wxlayer .dr{animation:wxdrop .7s linear infinite}
 .wxlayer .fl{animation:wxsnow 6s linear infinite}
 .wxlayer .fg.a{animation:wxfog 14s ease-in-out infinite alternate} .wxlayer .fg.b{animation:wxfog 18s ease-in-out infinite alternate-reverse}
 .wxlayer .flash{animation:wxflash 7s steps(1) infinite}
}
@media (prefers-reduced-motion:reduce){.wxlayer .dr,.wxlayer .fl{display:none}}
@keyframes wxdrop{to{transform:translate(-160px,110vh) rotate(12deg)}}
@keyframes wxsnow{0%{transform:translate(0,0)}50%{transform:translate(14px,55vh)}100%{transform:translate(-6px,110vh)}}
@keyframes wxfog{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
@keyframes wxflash{0%,93%,100%{opacity:0}94%{opacity:.35}95%{opacity:0}96%{opacity:.22}}
.grpbox{fill:none;stroke:var(--sun);stroke-width:1.5;stroke-dasharray:2 4;pointer-events:none}
.rotring{fill:none;stroke:var(--sun);stroke-width:2;stroke-dasharray:5 5;pointer-events:none}
.rothit{fill:none;stroke:transparent;stroke-width:30px;pointer-events:stroke;cursor:grab}
.rotline{stroke:var(--sun);stroke-width:1.5;opacity:.6;pointer-events:none}
.rotknob{fill:var(--sun);stroke:var(--surface);stroke-width:2;cursor:grab}
.rotknobt{fill:#1d1404;font-family:var(--f-mono);font-weight:600;pointer-events:none}
.edgehit{stroke:transparent;stroke-width:24px;pointer-events:stroke;cursor:move;fill:none}
.vtx{fill:var(--surface);stroke:var(--accent);stroke-width:2.5;cursor:move} .vtx.sel{fill:var(--sun);stroke:var(--ink)} .mid{fill:var(--accent);fill-opacity:.55;cursor:copy}
.edgetxt{fill:var(--accent);font-family:var(--f-mono);font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.guide{stroke:var(--sun);stroke-width:1.5;stroke-dasharray:4 3;pointer-events:none}
#shadeL,#overL{pointer-events:none}
#map.editing{box-shadow:inset 0 0 0 3px var(--sun)}
.modetag{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;background:var(--sun);color:#1d1404;padding:3px 10px;border-radius:99px;pointer-events:none}
.cs-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.cs-head .nm{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.15;text-wrap:balance}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick .btn{min-height:46px;padding:0 8px;font-size:13.5px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px 0;justify-self:start}
.info{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2)}
.ilist{display:grid;gap:8px}
.irow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.irow>i{width:12px;height:12px;border-radius:50%;display:block}
.irow>i.drop{background:var(--water);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.irow b{display:block}
.st{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.st.ready{color:var(--ok);font-weight:600}.st.blocked{color:var(--danger);font-size:12px}
.badge.shade circle{fill:var(--muted)} .badge.green circle{fill:var(--ok)} .badge.blue circle{fill:var(--water)}
.helpgrid{display:grid;gap:10px}
.hrow{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.hrow .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-family:var(--f-mono)}
.hrow .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.dot-b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-family:var(--f-mono);font-weight:600}
.abhome{display:grid;gap:12px}
.wxhero{display:grid;gap:12px;padding:16px;border-radius:20px;border:1px solid var(--line);text-align:left;width:100%;color:var(--ink);background:linear-gradient(160deg,var(--sky1),var(--sky2));position:relative;overflow:hidden}
.wxhero.rain,.wxhero.showers,.wxhero.drizzle,.wxhero.storm{--sky1:var(--skyr1);--sky2:var(--skyr2)}
.wxhero.cloudy,.wxhero.fog{--sky1:var(--skyc1);--sky2:var(--skyc2)}
.wxhero.night{--sky1:var(--skyn1);--sky2:var(--skyn2)}
.wxhero.night{color:#eef1f8;--glass:rgba(255,255,255,.14)}
.wxhero.night .note,.wxhero.night .wxdeg small{color:rgba(238,241,248,.7)}
.wxhero.night .wxdays .note{color:rgba(238,241,248,.6)}
.wxmain{display:flex;align-items:center;gap:14px}
.wxhero .wxi{width:84px;height:84px;flex:none}
.wxt{display:grid;gap:2px}
.wxdeg{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wxdeg small{font-size:18px;font-weight:500;color:var(--muted);margin-left:2px}
.wxlbl{font-weight:700;font-size:15px}
.wxbits{display:flex;flex-wrap:wrap;gap:6px}
.wxbits span{font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--glass);font-family:var(--f-mono)}
.wxbits .wfrost{background:var(--frost);color:#fff;font-weight:600}
.glist{display:grid;margin-top:6px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grpinfo{display:grid;gap:8px;padding:10px 12px;border:1px dashed var(--sun);border-radius:12px}
.grow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;min-height:46px;background:var(--surface)}
.grow+.grow{border-top:1px solid var(--line)}.grow.cur{background:var(--surface-2)}
.rainform{max-width:360px}
.aucard{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);scroll-margin-top:72px}
.aucard.run{border-color:var(--water);box-shadow:0 0 0 1px var(--water) inset}
.auhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.auhead b{font-family:var(--f-display);font-size:17px}
.aumode{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.aumode.sensor,.aumode.program{background:var(--accent);color:var(--accent-ink)}
.augauge{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.augauge .g{position:relative;height:8px;border-radius:9px;background:var(--surface-2)}
.augauge .g span{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--water)}
.augauge .g.water span{background:var(--water);opacity:.75}
.augauge .g i{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px}
.audec{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;font-size:13.5px}
.audec i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--muted)}
.audec.go i{background:var(--water)}.audec.ok i{background:var(--ok)}.audec.skip i{background:var(--sun)}.audec.wait i{background:var(--water);opacity:.6}
.autimer{display:grid;gap:8px}
.aumin{width:74px;min-height:34px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px;font:inherit;font-size:13px;color:var(--ink)}
.aurun{display:grid;gap:8px}.aurun .bar{height:8px}.aurun .bar span{background:var(--water);transition:width 1s linear}
.aurules{display:grid;gap:12px;padding-top:10px;border-top:1px dashed var(--line)}
.austeps{margin:0;padding-left:20px;display:grid;gap:10px;font-size:13.5px}
.austeps code,.autok{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);padding:1px 6px;border-radius:6px;word-break:break-all}
.aulog{display:grid;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:2px 12px}
.aulog>div{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;font-size:13.5px}
.aulog>div+div{border-top:1px solid var(--line)}
.aulog i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--muted)}
.aulog .water i{background:var(--water)}.aulog .skip i{background:var(--sun)}.aulog .error i{background:var(--danger)}
.aucta{text-align:left;width:100%;cursor:pointer}
.aucta .chev{color:var(--muted);font-size:20px}
.aurow{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;font-size:13.5px}
.aurow i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--ok)}
.aurow i.on{background:var(--water);animation:aupulse 1.4s ease-in-out infinite}.aurow i.due{background:var(--water);opacity:.6}.aurow i.skip{background:var(--sun)}
@keyframes aupulse{50%{transform:scale(1.6);opacity:.5}}
.wxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.wxtile{display:grid;gap:1px;padding:8px 10px;border-radius:12px;background:var(--glass)}
.wxtile span{font-size:11.5px;opacity:.75}.wxtile b{font-family:var(--f-mono);font-size:15px}.wxtile small{font-size:11px;opacity:.7}
.wxhours{display:flex;gap:2px;overflow-x:auto;padding:8px 4px;margin:0 -4px;border:1px solid var(--line);border-radius:16px;background:var(--surface);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wxhours::-webkit-scrollbar{display:none}
.wxh{flex:none;width:48px;display:grid;justify-items:center;gap:1px;font-size:12px;padding:2px 0;border-radius:10px}

.photoprev{display:flex;gap:10px;align-items:center}
.photoprev img{width:64px;height:64px;object-fit:cover;border-radius:8px}

.page{display:grid;gap:18px;padding-block:16px 96px;padding-inline:16px;max-width:760px;margin:0 auto}
.page h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.section-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hv{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.hvlist{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hvlist .hv:last-child{border-bottom:0}
.hv .dot{width:14px;height:14px;border-radius:50%}
.hv .t{font-weight:700} .hv .s{font-size:13px;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--accent)}
.due{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.due.ready{color:var(--ok);font-weight:600} .due.blocked{color:var(--danger);font-weight:600}
.crop{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;max-width:340px}
.months span{font-family:var(--f-mono);font-size:10.5px;text-align:center;padding:3px 0;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.months span.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.months span.now{position:relative;font-weight:700;color:var(--ink)}
.months span.now::after{content:"";position:absolute;left:50%;bottom:-5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--sun)}
.months span.on.now{color:var(--accent-ink)}
.mlbl{width:86px;flex:none;font-size:11px;font-weight:700;color:var(--muted);line-height:1.15}
.search{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:grid;gap:2px}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;color:var(--muted);font-weight:500}
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.hbar .track{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.hbar .track span{display:block;height:100%;border-radius:6px}
.hbar .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.cmp{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface)}
table.cmp th,table.cmp td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.cmp td:first-child{font-family:var(--f-body)}
table.cmp tr:last-child td{border-bottom:0}
.up{color:var(--ok)} .down{color:var(--danger)}
.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .b1{fill:var(--water)} .chart .b2{fill:var(--sun)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:2px 12px max(env(safe-area-inset-bottom,0px),16px)}
.tabs button{display:grid;justify-items:center;gap:3px;padding:8px 2px 6px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);z-index:20;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--sun);font-weight:700}
@media (min-width:760px){ .sheet{left:auto;right:16px;bottom:16px;width:380px;border-radius:18px;border:1px solid var(--line);max-height:calc(100% - 32px)} .sunbar{right:auto;width:420px}}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(16px);opacity:.6}} }
</style>

/* ================= Géométrie des planches ================= */
function zoneGrid(o,z){
  const p=P[z.crop];if(!p)return null;
  const W=Math.min(o.w,o.h);
  const cols=Math.max(1,Math.floor(z.len/Math.max(p.pl,15))),rows=Math.max(1,Math.floor(W/Math.max(p.rang,15)));
  const cellL=z.len/cols,cellW=W/rows;
  return{cols,rows,cellL,cellW,per:Math.max(1,Math.round(cellL/p.pl))*Math.max(1,Math.round(cellW/p.rang))};
}
function fillZone(o,z,date,frac=1){const g=zoneGrid(o,z);if(!g)return;for(let r=0;r<g.rows;r++)for(let c=0;c<Math.ceil(g.cols*frac);c++)if(!z.cells[r+'-'+c])z.cells[r+'-'+c]=date}
function trimCells(o,z){const g=zoneGrid(o,z);if(!g){z.cells={};return}for(const k in z.cells){const[r,c]=k.split('-').map(Number);if(r>=g.rows||c>=g.cols)delete z.cells[k]}}
const zoneArea=(o,z)=>z.len*Math.min(o.w,o.h)/1e4;
/* contenance d'une cuve cylindrique : π r² h, en litres */
const cuveL=o=>o.type==='citerne'?(+o.vol||0):Math.PI*(o.w/2)**2*(+o.height||0)/1000;
function tankCap(){const cs=allObjs().filter(o=>o.type==='cuve'&&+o.height>0||o.type==='citerne'&&+o.vol>0);return cs.length?{n:cs.length,cap:Math.round(cs.reduce((s,o)=>s+cuveL(o),0))}:null}

function plantings(){const out=[];plantables().forEach(o=>{const bu=blockUntil(o);o.zones.forEach((z,zi)=>{const p=P[z.crop];if(!p)return;const g=zoneGrid(o,z),by={};

  for(const d in by){const hv=addD(d,p.j);out.push({o,z,zi,p,d,n:by[d].length*g.per,hv,bu,left:days(TODAY,hv),prog:clamp(days(parse(d),TODAY)/p.j,0,1)})}})});
  return out.sort((a,b)=>a.hv-b.hv)}
function hvRow(x){const due=x.bu&&x.left<=0?`<span class="due blocked">bloquée<br>→ ${fdate(x.bu)}</span>`:`<span class="due ${x.left<=0?'ready':''}">${x.left<=0?(x.left<-14?'prête depuis<br>'+(-x.left)+' j':'prête'):'dans<br>'+x.left+' j'}</span>`;
  return`<button class="hv" data-open="${x.o.id}" data-zi="${x.zi}">${ring(x.prog,x.p.id,x.left<=0&&!x.bu)}<span style="min-width:0"><span class="t">${x.p.n}</span> <span class="s">· ${esc(fullName(x.o))} · ≈ ${x.n} plant${x.n>1?'s':''}</span>
  <span class="s" style="display:block">Semé le ${fdate(parse(x.d))} → récolte ${fdate(x.hv)}${x.bu?' · traitement en cours':''}</span><span class="bar"><span style="width:${Math.round(x.prog*100)}%"></span></span></span>${due}</button>`}

function pestsNow(){const mo=TODAY.getMonth()+1,inPlace=[];plantables().forEach(o=>o.zones.forEach(z=>{if(z.crop&&Object.keys(z.cells).length)inPlace.push({o,crop:z.crop})}));
  return PESTS.filter(p=>p.m.includes(mo)).map(p=>({...p,where:inPlace.filter(x=>p.c.includes(x.crop))})).filter(p=>p.where.length)}
const MABR=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const mRange=ms=>{const a=Math.min(...ms),b=Math.max(...ms);return MABR[a-1]+(a!==b?'–'+MABR[b-1]:'')};

  const soon=act.filter(n=>readyOf(n)>TODAY).sort((a,b)=>readyOf(a)-readyOf(b));

  const sg=PLANTS.filter(p=>(p.sg||[]).includes(mo));

let cq='';
const inSeason=(p,d)=>{const m=(d||TODAY).getMonth()+1,n=m%12+1;return p.m.includes(m)||p.m.includes(n)};
const seasonTxt=p=>{const ms=[...p.m].sort((a,b)=>a-b);return ms.map(x=>MABR[x-1]).join(', ')};
const hasSeedsFor=id=>(S.stock||[]).some(q=>q.cat==='graine'&&q.crop===id&&stockOf(q)>0&&!expired(q));
function cropGroups(){const mo=TODAY.getMonth()+1,act=nurseryActive();
  const G=[{k:1,t:'À planter maintenant : tes plants sont prêts',d:'Plants en godets prêts à repiquer.',l:[]},
    {k:2,t:'À semer ou planter maintenant : graines ou plants en cours',d:'Semis direct ou plantation ce mois-ci.',l:[]},
    {k:3,t:'À semer en godets maintenant : tu as les graines',d:'À démarrer à l\'abri.',l:[]},
    {k:4,t:'À semer en place maintenant : graines à acheter',d:'C\'est la saison, mais rien en stock.',l:[]},
    {k:5,t:'À semer en godets maintenant : graines à acheter',d:'C\'est la saison, mais rien en stock.',l:[]},
    {k:6,t:'Hors saison',d:'Triées par prochain mois de semis.',l:[]}];
  PLANTS.forEach(p=>{const now=p.m.includes(mo),sgNow=(p.sg||[]).includes(mo),seeds=hasSeedsFor(p.id),pl=act.filter(n=>n.crop===p.id);
    const ready=pl.some(n=>readyOf(n)<=TODAY);const k=now&&ready?1:now&&seeds?2:now&&pl.length?2:sgNow&&seeds?3:now?4:sgNow?5:6;G[k-1].l.push({p,seeds,pl,now,sgNow})});
  const nextM=p=>{const ms=[...p.m,...(p.sg||[])];let best=13;ms.forEach(x=>{const d=(x-mo+12)%12;if(d>0&&d<best)best=d});return best};
  G[5].l.sort((a,b)=>nextM(a.p)-nextM(b.p));
  G.forEach(g=>{if(g.k<6)g.l.sort((a,b)=>a.p.n.localeCompare(b.p.n,'fr'))});
  return G}

   <div class="row between"><div class="row">${ci(p.id,1,'big')}<h3>${p.n}</h3><span class="note">${p.f}</span></div><span class="mono note">≈ ${p.j} j${FROST_SENSITIVE.has(p.id)?' · gélive':''}</span></div>

   <div class="row" style="flex-wrap:nowrap"><span class="mlbl">Plantation / semis direct</span><div class="months" style="flex:1">${MSHORT.map((l,i)=>`<span class="${p.m.includes(i+1)?'on':''} ${i+1===mo?'now':''}" title="${MONTHS[i]}">${l}</span>`).join('')}</div></div></div>
   ${acts||acts2||acts3?`<div class="row">${acts}${acts2}${acts3}</div>`:''}

   ${ps.length?`<div class="note">À surveiller : ${ps.map(y=>`${y.n} (${mRange(y.m)})`).join(', ')}</div>`:''}
  </div>`};

/* ================= Arrosage automatique (GARDENA smart system via le relais Cloudflare) ================= */
/* La même règle de décision tourne ici (pour l'affichage) et dans le relais (pour agir, app fermée). */
/*DECIDE*/
function autoDecide(z,st,now,fc){
  if(!z||!z.mode||z.mode==='off')return{go:false,off:true,why:'Automatique coupé : arrosage à la demande seulement'};
  const hours=z.hours&&z.hours.length?z.hours:[6],gap=z.gap||20,thr=z.thr||30,sinceH=st.lastRun?(now.ms-st.lastRun)/3.6e6:1e9;
  if(z.mode==='sensor'){if(!z.sensor)return{go:false,why:'Choisis une sonde dans les réglages'};if(st.soil==null)return{go:false,why:'La sonde ne donne pas de mesure'};
    if(st.soil>=thr)return{go:false,ok:true,why:'Sol à '+Math.round(st.soil)+' %, au-dessus du seuil de '+thr+' % : pas besoin'}}
  if(z.mode==='program'){const due=(z.every||2)*24-3;if(sinceH<due)return{go:false,ok:true,why:'Prochain arrosage programmé dans '+Math.max(1,Math.ceil((due-sinceH)/24))+' j'}}
  if(sinceH<gap)return{go:false,ok:true,why:'Déjà arrosé il y a '+Math.round(sinceH)+' h'};
  if(fc&&fc.rain24!=null&&z.skipRain>0&&fc.rain24>=z.skipRain)return{go:false,skip:true,why:'Sauté : '+String(Math.round(fc.rain24*10)/10).replace('.',',')+' mm de pluie prévus sur 24 h'};
  if(st.tankEst!=null&&st.tankMin!=null&&st.tankEst-(z.flow||8)*(z.min||15)<st.tankMin)return{go:false,skip:true,why:'Sauté : cuve trop basse'};
  if(st.busy)return{go:false,wait:true,why:'Attend la fin de l\'arrosage en cours'};
  if(!hours.some(h=>now.h>=h&&now.h<h+2))return{go:false,wait:true,due:true,why:'Arrosera au prochain créneau ('+hours.map(h=>h+' h').join(', ')+')'};
  return{go:true,why:z.mode==='sensor'?'Sol à '+Math.round(st.soil)+' %, sous le seuil de '+thr+' %':'Programme tous les '+(z.every||2)+' j'}}
/*/DECIDE*/

/* ---- relais ---- */
async function gReq(path,method='GET',body,cfg){const c=cfg||GDN.get();if(!c.url)throw new Error('Aucun relais relié.');
  let r;try{r=await fetch(c.url.trim().replace(/\/+$/,'')+path,{method,headers:{'X-Potager-Key':c.token||'','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}
  catch(e){throw new Error(inClaude()?'Le relais ne se joint que depuis l\'app installée, pas dans Claude.':'Relais injoignable : vérifie l\'adresse et la connexion.')}
  const j=await r.json().catch(()=>({}));if(!r.ok){const er=new Error(j.error||('Le relais a répondu '+r.status+'.'));er.status=r.status;er.data=j;throw er}return j}
function gdSet(j){gdst={state:j.state,log:j.log||[],at:Date.now(),err:j.state&&j.state.err||null,cfgAt:j.cfgAt||null};gImport()}
async function gSync(fresh){const c=GDN.get();
  if(c.demo){if(!gdst||!gdst.demo)gdst=demoInit();demoTick();renderAutoAll();return}
  if(!gLinked()||gdBusy)return;gdBusy=true;renderAutoAll();
  try{gdSet(await gReq('/status'+(fresh?'?fresh=1':'')))}catch(e){gdst={...(gdst||{}),err:e.message,at:gdst&&gdst.at}}
  finally{gdBusy=false;renderAutoAll()}}
/* les arrosages faits par GARDENA s'inscrivent dans le journal des planches et vident la cuve */
function gImport(){if(!gdst||gdst.demo||!gdst.log)return;const seen=new Set(S.autoSeen||[]),c=autoCfg(),fromTank=c.pump.kind!=='none';let ch=false;
  gdst.log.slice().reverse().forEach(e=>{if(seen.has(e.id))return;seen.add(e.id);const z=c.zones[e.valve],flow=(z&&z.flow)||8;
    if(e.type==='water'){(z&&z.objs||[]).forEach(id=>{const o=obj(id);if(o){o.journal=o.journal||[];o.journal.push({id:uid(),k:'arrosage',d:iso(new Date(e.at)),t:`${valveName(e.valve)} · ${num(e.min,0)} min${e.how==='auto'?' (automatique)':''}`,src:'gardena'})}});
      if(fromTank&&S.water)S.water.level=Math.max(0,Math.round(S.water.level-flow*e.min));ch=true}
    if(e.type==='stop'&&e.left>0&&fromTank&&S.water){S.water.level=Math.min(S.water.cap,Math.round(S.water.level+flow*e.left));ch=true}});
  const nv=[...seen].slice(-300);if(ch||nv.length!==(S.autoSeen||[]).length){S.autoSeen=nv;save(true)}if(ch)pushCfgSoon()}
function pushCfgSoon(){clearTimeout(cfgT);cfgT=setTimeout(pushCfg,1500)}

  catch(e){toast('Réglages non envoyés au relais : '+e.message)}}

function decideNow(id){const z=zc(id),c=autoCfg(),log=(gdst&&gdst.log)||[],sen=z.sensor&&gSensors().find(s=>s.id===z.sensor);

  const busy=gValves().some(v=>v.id!==id&&isRun(v));
  return autoDecide(z,{soil:sen?sen.soil:null,lastRun,busy,tankEst:c.pump.kind!=='none'&&S.water?S.water.level:null,tankMin:c.tankMin},{h:new Date().getHours(),ms:Date.now()},{rain24:rainNext24()})}

var syncT=null,syncBusy=false,syncErr=null,syncAt=0;
function syncPushSoon(){try{if(!relayOn())return;clearTimeout(syncT);syncT=setTimeout(()=>syncPush(GID),2500)}catch(e){}}
const localAtOf=id=>id===GID?localAt:(+localStorage.getItem(keyAtOf(id))||0);
const stateOf=id=>id===GID?lastJSON:localStorage.getItem(keyOf(id));
async function syncPush(id){if(!relayOn())return;const at=localAtOf(id),j=stateOf(id);if(!at||!j)return;
  try{await gReq('/garden?id='+encodeURIComponent(id),'PUT',{state:JSON.parse(j),at});syncErr=null;syncAt=Date.now()}
  catch(e){if(e.status===409){syncPull()}else syncErr=e.message}renderSyncLine()}
async function syncPull(manual){if(!relayOn()||syncBusy)return;syncBusy=true;
  try{const r=await gReq('/gardens'),c=GDN.get();if(c.gardena!==!!r.gardena)GDN.set({...c,gardena:!!r.gardena});
    const reg=GL.get();let regCh=false,curCh=false;
    for(const g of r.list){const loc=reg.list.find(x=>x.id===g.id);
      if(g.del){if(loc&&reg.list.length>1){reg.list=reg.list.filter(x=>x.id!==g.id);regCh=true;try{localStorage.removeItem(keyOf(g.id));localStorage.removeItem(keyAtOf(g.id))}catch(e){}if(g.id===GID)curCh='gone'}continue}
      if(g.at>localAtOf(g.id)){const d=await gReq('/garden?id='+encodeURIComponent(g.id));if(!d||!d.state)continue;
        if(g.id===GID){past.push(lastJSON);if(past.length>80)past.shift();future=[];S=migrate(d.state);lastJSON=JSON.stringify(S);localAt=d.at;persist();curCh=true}
        else{try{localStorage.setItem(keyOf(g.id),JSON.stringify(d.state));localStorage.setItem(keyAtOf(g.id),String(d.at))}catch(e){}}
        if(!loc){reg.list.push({id:g.id,name:g.name,ex:g.ex});regCh=true}}}
    if(regCh){const cur=GL.get();cur.list=reg.list.map(x=>({...x}));GL.set(cur)}
    /* ce que le relais n'a pas encore, ou en plus ancien */
    for(const l of GL.get().list){const g=r.list.find(x=>x.id===l.id);if(g&&g.del)continue;if(localAtOf(l.id)>(g?g.at:0))await syncPush(l.id)}
    syncErr=null;syncAt=Date.now();
    if(curCh==='gone'){GID=null;switchGarden(GL.get().list[0].id)}
    else if(curCh){if(selId&&!obj(selId)){selId=null;if(sheetMode==='obj')sheetMode=null}renderHeader();refresh();if(manual)toast('Potager mis à jour depuis ton autre appareil')}
    else if(manual)toast('Tout est à jour')}
  catch(e){syncErr=e.status===401?'Code d\'accès refusé par le relais':e.message;if(manual)toast(syncErr)}
  finally{syncBusy=false;renderSyncLine();if(sheetMode==='menu'||sheetMode==='relay')renderSheet()}}

let wxLayerKey='';
function renderWxLayer(){const el=$('#wxlayer');if(!el)return;
  if(!liveWx()||!wx.cur){el.hidden=true;wxLayerKey='';return}
  const k=wxKind(wx.cur.code),hr=new Date().getHours(),night=!wx.cur.isDay;
  const frost=(wx.now&&wx.now.t!=null&&wx.now.t<=1)||(wx.night!=null&&wx.night<=0&&(hr>=18||hr<9));
  const wet=!ctx&&['rain','drizzle','showers','storm'].includes(k),snow=!ctx&&k==='snow',fog=!ctx&&k==='fog';
  const cls=[night?'night':'',frost&&!ctx?'frost':'',wet?'wet':'',k==='rain'||k==='storm'?'heavy':'',k==='storm'&&!ctx?'storm':'',snow?'snowy':'',fog?'foggy':''].filter(Boolean);
  const key=cls.join(' ');if(!key){el.hidden=true;wxLayerKey='';return}
  el.hidden=false;if(key===wxLayerKey)return;wxLayerKey=key;el.className='wxlayer '+key;
  let h='';const R=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join('');
  if(wet)h+=R(k==='drizzle'?26:46,i=>`<i class="dr" style="left:${(i*37%100)+Math.random()*2}%;animation-delay:${(Math.random()*1.2).toFixed(2)}s;animation-duration:${(.55+Math.random()*.35).toFixed(2)}s"></i>`);
  if(snow)h+=R(36,i=>`<i class="fl" style="left:${(i*29%100)+Math.random()*3}%;animation-delay:${(Math.random()*6).toFixed(2)}s;animation-duration:${(5+Math.random()*4).toFixed(2)}s"></i>`);
  if(fog)h+='<i class="fg a"></i><i class="fg b"></i>';
  if(k==='storm'&&!ctx)h+='<i class="flash"></i>';
  el.innerHTML=h}

  if(q.step==='menu'){const th=plantables().filter(o=>thirsty(o)).length,rd=plantings().filter(x=>x.left<=0&&!x.bu).length;
    h+=`<div class="stack">${head('Noter')}<div class="qgrid">
    <button class="qbtn" data-q="water">${ico('<path d="M4 14h10l3-4h3M7 14v4a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-4"/><path d="M19 13v.01M20 16v.01M18 18v.01"/>')}Arrosage<span>${th?th+' planche'+(th>1?'s':'')+' à arroser':'Planches arrosées'}</span></button>
    <button class="qbtn" data-q="harvest">${ico('<path d="M4 9h16l-2 11H6z"/><path d="M8 9a4 4 0 0 1 8 0"/>')}Récolte<span>${rd?rd+' prête'+(rd>1?'s':''):'Peser une récolte'}</span></button>
    <button class="qbtn" data-q="rain">${ico('<path d="M7 15a4 4 0 0 1 .6-8A5 5 0 0 1 17 8a3.5 3.5 0 0 1 0 7z"/><path d="M9 18l-1 2M13 18l-1 2M17 18l-1 2"/>')}Pluie<span>Si la station n'est pas reliée</span></button>
    <button class="qbtn" data-q="semis">${ico('<path d="M6 20h12l-1.5-7h-9z"/><path d="M12 13V8"/><path d="M12 9c0-3 2-5 5-5 0 3-2 5-5 5z"/>')}Semis en godets<span>Dans l'abri</span></button>
    <button class="qbtn wide" data-q="note">${ico('<path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/>')}Note ou photo<span>Observation sur une planche</span></button></div></div>`}
  else if(q.step==='water'){const L=plantables().filter(o=>o.zones.some(z=>z.crop&&Object.keys(z.cells).length));
    h+=`<div class="stack">${head('Arrosage du jour')}<div class="qlist">${L.map(o=>`<label><input type="checkbox" value="${o.id}" ${thirsty(o)?'checked':''}><span><b>${esc(fullName(o))}</b><span class="note" style="display:block">${waterText(lastWater(o))}</span></span></label>`).join('')||'<p class="note">Aucune planche plantée.</p>'}</div>
    <div class="row"><button class="btn small" data-q="allwater">Tout cocher</button><button class="btn primary" data-q="dowater">Noter l'arrosage</button></div></div>`}
  else if(q.step==='rain'){h+=`<div class="stack">${head('Pluie')}<div class="grid2"><label class="field"><span class="lbl">Date</span><input id="q-d" type="date" value="${iso(TODAY)}"></label><label class="field"><span class="lbl">Quantité (mm)</span><input id="q-mm" type="number" min="0" step="0.5" placeholder="facultatif"></label></div><button class="btn primary" data-q="dorain">Noter la pluie</button></div>`}
  else if(q.step==='harvest'){const L=qPlanches(),rdIds=new Set(plantings().filter(x=>x.left<=0&&!x.bu).map(x=>x.o.id));L.sort((a,b)=>(rdIds.has(b.id)-rdIds.has(a.id))||(!!blockUntil(a)-!!blockUntil(b)));
    const o=obj(q.o)||L[0];if(o)q.o=o.id;const crops=o?[...new Set(o.zones.filter(z=>z.crop).map(z=>z.crop))]:[];const bu=o&&blockUntil(o);
    h+=`<div class="stack">${head('Récolte')}<div class="grid2"><label class="field span2"><span class="lbl">Planche</span><select id="q-o">${L.map(x=>`<option value="${x.id}" ${o&&x.id===o.id?'selected':''}>${esc(fullName(x))}${rdIds.has(x.id)?' · prête':''}</option>`).join('')}</select></label>
    <label class="field"><span class="lbl">Culture</span><select id="q-c">${crops.map(c=>`<option value="${c}">${P[c].n}</option>`).join('')}</select></label><label class="field"><span class="lbl">Poids (kg)</span><input id="q-kg" type="number" min="0" step="0.1" inputmode="decimal"></label></div>
    ${bu?`<div class="alert"><span>Récolte impossible avant le <b>${fdate(bu)}</b> : délai après traitement.</span></div>`:''}<button class="btn primary" data-q="doharvest" ${bu?'disabled':''}>Noter la récolte</button></div>`}
  else if(q.step==='note'){const L=plantables();h+=`<div class="stack">${head('Note ou photo')}<label class="field"><span class="lbl">Planche</span><select id="q-o">${L.map(x=>`<option value="${x.id}">${esc(fullName(x))}</option>`).join('')}</select></label>
    <label class="field"><span class="lbl">Note</span><textarea id="q-t" placeholder="Ce que tu observes"></textarea></label>
    <div class="photoprev">${q.photo?`<img src="${photoSrc(q.photo)}" alt="Photo jointe"><button class="btn small" data-q="nophoto">Retirer</button>`:'<label class="btn small" for="q-ph">Ajouter une photo</label>'}<input id="q-ph" type="file" accept="image/*" hidden></div>
    <button class="btn primary" data-q="donote">Enregistrer</button></div>`}
  el.innerHTML=h}
$('#noteBtn').onclick=()=>openQ();
$('#qback').onclick=closeQ;
$('#qsheet').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const a=b.dataset.q;
  if(a==='close')return closeQ();
  if(['menu','water','rain','harvest','note'].includes(a)){q.step=a;return renderQ()}
  if(a==='semis'){closeQ();openInv('semis');inv.add=true;renderInv();return}
  if(a==='allwater'){$('#qsheet').querySelectorAll('.qlist input').forEach(i=>i.checked=true);return}
  if(a==='dowater'){const ids=[...$('#qsheet').querySelectorAll('.qlist input:checked')].map(i=>i.value);if(!ids.length)return toast('Coche au moins une planche');
    ids.forEach(id=>{const o=obj(id);o.journal=o.journal||[];o.journal.push({id:uid(),k:'arrosage',d:iso(TODAY),t:''})});save();closeQ();refresh();return toast(`Arrosage noté sur ${ids.length} planche${ids.length>1?'s':''}`,true)}
  if(a==='dorain'){const v=parseFloat(String($('#q-mm').value).replace(',','.'));addRain(isNaN(v)?null:v,$('#q-d').value||iso(TODAY));save();closeQ();refresh();return toast('Pluie notée',true)}
  if(a==='doharvest'){const o=obj($('#q-o').value),kg=parseFloat(String($('#q-kg').value).replace(',','.'))||0;if(!o)return;if(!kg)return toast('Indique le poids récolté');
    const cr=$('#q-c').value;o.journal=o.journal||[];o.journal.push({id:uid(),k:'recolte',d:iso(TODAY),crop:cr,kg});save();closeQ();refresh();return toast(`${P[cr]?P[cr].n:'Récolte'} : ${num(kg)} kg notés`,true)}
  if(a==='nophoto'){q.photo=null;return renderQ()}
  if(a==='donote'){const o=obj($('#q-o').value),t=$('#q-t').value.trim();if(!t&&!q.photo)return toast('Écris une note ou ajoute une photo');
    o.journal=o.journal||[];const en={id:uid(),k:'note',d:iso(TODAY),t};if(q.photo)en.ph=q.photo;o.journal.push(en);save();closeQ();refresh();return toast('Note enregistrée : '+o.name,true)}});
$('#qsheet').addEventListener('change',async e=>{const t=e.target;if(!q)return;
  if(t.id==='q-o'&&q.step==='harvest'){q.o=t.value;renderQ()}
  if(t.id==='q-ph'){const f=t.files[0];if(!f)return;const txt=($('#q-t')||{}).value||'',sel=($('#q-o')||{}).value;try{q.photo=await processPhoto(f)}catch(_){return toast("La photo n'a pas pu être lue")}renderQ();if($('#q-t'))$('#q-t').value=txt;if(sel&&$('#q-o'))$('#q-o').value=sel}});

/* ================= Gestes tactiles (style iOS) ================= */
let swipedAt=0;
function gesture(el,h){let st=null;
  el.addEventListener('touchstart',e=>{if(e.touches.length!==1){st=null;return}const t=e.touches[0],c=h.start(e,t);st=c?{...c,x0:t.clientX,y0:t.clientY,axis:null}:null},{passive:true});
  /* suivi sur tout le document : la page peut se redessiner pendant le geste (météo qui arrive) */
  document.addEventListener('touchmove',e=>{if(!st)return;const t=e.touches[0],dx=t.clientX-st.x0,dy=t.clientY-st.y0;
    if(!st.axis){if(Math.hypot(dx,dy)<8)return;st.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';if(st.want&&st.axis!==st.want){h.end(st,0,0,true);st=null;return}}
    if(h.move(st,dx,dy)===true&&e.cancelable)e.preventDefault()},{passive:false});
  document.addEventListener('touchend',e=>{if(!st)return;const t=e.changedTouches[0];h.end(st,t.clientX-st.x0,t.clientY-st.y0,false);st=null},{passive:true});
  document.addEventListener('touchcancel',()=>{if(st){h.end(st,0,0,true);st=null}},{passive:true})}
/* menu du bas : glisser vers le bas pour fermer */
gesture(sheet,{start:(e)=>{if(!sheetMode||sheet.scrollTop>2)return null;if(e.target.closest('input,select,textarea,.seg,[data-noswipe]'))return null;return{want:'y'}},
  move:(st,dx,dy)=>{if(dy<=0){sheet.style.transform='';return false}sheet.classList.add('dragging');sheet.style.transform=`translateY(${dy}px)`;return true},
  end:(st,dx,dy,cancel)=>{sheet.classList.remove('dragging');if(!cancel&&dy>90){sheet.style.transform=`translateY(100%)`;setTimeout(()=>{sheet.style.transform='';sheetMode=null;selId=null;if(shapeEdit===null)renderSheet();renderPlan()},180)}else sheet.style.transform=''}});
/* planche et abri : glisser depuis le bord gauche pour revenir */
[['#bedView'],['#invView'],['#autoView']].forEach(([sel])=>{const el=$(sel);gesture(el,{start:(e,t)=>t.clientX<28?{want:'x'}:null,
  move:(st,dx)=>{if(dx<=0)return false;el.classList.add('dragging');el.style.transform=`translateX(${dx}px)`;return true},
  end:(st,dx,dy,cancel)=>{el.classList.remove('dragging');if(!cancel&&dx>90){el.style.transform='translateX(100%)';setTimeout(()=>{el.style.transform='';const b=el.querySelector('.bedhead .iconbtn');if(b)b.click()},180)}else el.style.transform=''}})});
/* Aujourd'hui : glisser une ligne à gauche (arrosé / récolte), tirer vers le bas pour actualiser */
gesture($('#v-today'),{start:(e,t)=>{const r=e.target.closest('[data-sw]');if(r)return{row:r,want:'x'};const v=$('#v-today');return v.scrollTop<=0?{ptr:true,want:'y'}:null},
  move:(st,dx,dy)=>{if(st.row){if(dx>=0){st.row.style.transform='';return false}st.row.style.transition='none';st.row.style.transform=`translateX(${Math.max(dx,-140)}px)`;return true}
    if(st.ptr){if(dy<=0)return false;const h=Math.min(80,dy*.5),p=$('#ptr');if(p){p.style.height=h+'px';p.classList.toggle('go',h>=56);$('#ptrt').textContent=h>=56?'Relâche pour actualiser':'Tire pour actualiser la météo'}return true}},
  end:(st,dx,dy,cancel)=>{if(st.row){const r=st.row.isConnected?st.row:(document.querySelector(`[data-sw="${st.row.dataset.sw}"]`)||st.row);r.style.transition='';if(!cancel&&dx<-80){swipedAt=Date.now();r.style.transform='translateX(-100%)';const[k,a,b,c]=r.dataset.sw.split(':');
      setTimeout(()=>{if(k==='w'){const o=obj(a);if(o){o.journal=o.journal||[];o.journal.push({id:uid(),k:'arrosage',d:iso(TODAY),t:''});save();toast('Arrosage noté : '+o.name,true)}renderToday()}
        else if(k==='h'){r.style.transform='';openBed(a,+b,'recolte',true);const sel=$('#j-crop');if(sel)sel.value=c;const kg=$('#j-kg');if(kg)kg.focus()}},200)}
      else{if(Math.abs(dx)>8)swipedAt=Date.now();r.style.transform=''}return}
    if(st.ptr){const p=$('#ptr');const go=p&&p.classList.contains('go');if(p){p.style.transition='height .2s';p.style.height=go?'44px':'0px';if(go)$('#ptrt').textContent='Actualisation…'}
      if(go&&!cancel){syncStation(true).finally(()=>{const q=$('#ptr');if(q){q.style.height='0px'}})}else setTimeout(()=>{const q=$('#ptr');if(q)q.style.transition=''},250)}}});

gesture($('#qsheet'),{start:(e)=>{const el=$('#qsheet');if(!q||el.scrollTop>2||e.target.closest('input,select,textarea,.qlist'))return null;return{want:'y'}},
  move:(st,dx,dy)=>{const el=$('#qsheet');if(dy<=0){el.style.transform='';return false}el.classList.add('dragging');el.style.transform=`translateY(${dy}px)`;return true},
  end:(st,dx,dy,cancel)=>{const el=$('#qsheet');el.classList.remove('dragging');if(!cancel&&dy>90){el.style.transform='translateY(100%)';setTimeout(()=>{el.style.transform='';closeQ()},180)}else el.style.transform=''}});
$('#noteBtnPlan').onclick=()=>openQ();

/* ================= Démarrage ================= */
function themePref(){try{return localStorage.getItem('potager-theme')||'auto'}catch(e){return'auto'}}
function setTheme(k){try{localStorage.setItem('potager-theme',k)}catch(e){}applyTheme()}
function applyTheme(){const k=themePref(),r=document.documentElement;if(k==='auto')delete r.dataset.theme;else r.dataset.theme=k;
  const dark=k==='dark'||(k==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content',dark?'#1d1e20':'#fafbf6'))}
applyTheme();
let seenHelp=false;try{seenHelp=!!localStorage.getItem('potager-aide-vue');localStorage.setItem('potager-aide-vue','1')}catch(e){}
if(!seenHelp)sheetMode='help';
renderHeader();requestAnimationFrame(()=>{fit();renderSheet();setTab('today')});
initCaps();
setTimeout(()=>syncStation(false),600);
</script>

<script>
setTimeout(()=>{const s=document.getElementById('splash');if(s){s.classList.add('out');setTimeout(()=>s.remove(),600)}},matchMedia('(display-mode: standalone)').matches||navigator.standalone?650:120);
/* version ff8f554906 : service worker « réseau d'abord » pour que chaque mise à jour arrive tout de suite */
if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded){reloaded=true;location.reload()}});
}
</script>
