<div class="app">
  <header class="top">
    <div><div class="brand">Atelier Potager<small id="gInfo"></small></div><button class="gpill" id="gPill" aria-label="Changer de potager"><span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
    <span class="pill" id="exPill" hidden>Exemple</span>
    <button class="iconbtn" id="undoBtnH" aria-label="Annuler l'action" title="Annuler l'action"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="iconbtn" id="redoBtnH" aria-label="Rétablir l'action" title="Rétablir l'action"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="iconbtn" id="menuBtn" aria-label="Menu du potager"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <main>
    <section class="view" id="v-today" hidden></section>
    <section class="view" id="v-plan">
      <svg id="map" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="g1" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" style="stroke:var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/></pattern>
          <pattern id="g5" width="500" height="500" patternUnits="userSpaceOnUse"><path d="M500 0H0V500" fill="none" style="stroke:var(--grid-strong)" stroke-width="1" vector-effect="non-scaling-stroke"/></pattern>
        </defs>
        <g id="groundL"></g><g id="layer"></g><g id="shadeL"></g><g id="overL"></g><g id="editL"></g>
      </svg>
      <button class="compass" id="compass" aria-label="Orientation du nord"><svg viewBox="-20 -20 40 40"><g id="needle"><path class="n" d="M0 -15L5 0H-5Z"/><path class="s" d="M0 15L5 0H-5Z"/></g><text id="ntxt" text-anchor="middle" dominant-baseline="central">N</text></svg></button>
      <div class="wxlayer" id="wxlayer" hidden></div>
      <div class="sunbar" id="sunbar" hidden></div>
      <div class="sunbar" id="shapebar" hidden></div>
      <div class="ctxbar" id="ctxbar" hidden></div>
      <div class="hint" id="hint" hidden></div>
      <div class="modetag" id="modetag" hidden>Mode édition</div>
      <div class="fab" id="fab">
        <button class="btn primary" id="noteBtnPlan" aria-label="Noter quelque chose"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Noter</button>
        <button class="btn" id="sunBtn" aria-label="Afficher les ombres"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button class="btn" id="fitBtn" aria-label="Recentrer le plan"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="btn" id="editBtn" aria-label="Modifier le plan" title="Modifier le plan"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></button>
        <button class="btn" id="addBtn" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Ajouter</button>
        <button class="btn primary" id="doneBtn" hidden>Terminer</button>
      </div>
      <div class="sheet" id="sheet" hidden></div>
    </section>
    <section class="view" id="v-harvest" hidden></section>
    <section class="view" id="v-weather" hidden></section>
    <section class="view" id="v-crops" hidden></section>
    <section class="bed" id="bedView" hidden></section>
    <section class="bed" id="invView" hidden></section>
    <section class="bed" id="autoView" hidden></section>
    <button class="notefab" id="noteBtn" aria-label="Noter quelque chose"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Noter</span></button>
    <div class="qback" id="qback" hidden></div>
    <div class="sheet qsheet" id="qsheet" hidden></div>
    <div class="qback" id="cback" hidden></div>
    <div class="sheet qsheet" id="csheet" role="dialog" aria-label="Culture" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </main>
  <nav class="tabs">
    <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>Aujourd'hui</button>
    <button data-tab="plan" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 3v18M14 3v18"/></svg>Plan</button>
    <button data-tab="harvest"><svg viewBox="0 0 24 24"><path d="M4 9h16l-2 11H6z"/><path d="M8 9a4 4 0 0 1 8 0"/></svg>Récoltes</button>
    <button data-tab="weather"><svg viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>Eau & météo</button>
    <button data-tab="crops"><svg viewBox="0 0 24 24"><path d="M5 20c0-8 5-14 15-15-1 10-7 15-15 15zM5 20l7-7"/></svg>Cultures</button>
  </nav>
  <input type="file" id="importIn" accept="application/json,.json" hidden>
</div>
